ds-delayed-keepInstances=نگه داشتن نمونه‌های مؤلفه‌های تأخیری
ds-delayed-keepInstances-help=پیکربندی کنید که آیا نمونه‌های مؤلفه‌های تأخیری پس از اینکه دیگر به آن‌ها اشاره نشود، نگه داشته شوند یا خیر. مشخصات خدمات اعلانی پیشنهاد می‌کند که نمونه‌های مؤلفه‌های تأخیری در صورت عدم استفاده طولانی مدت از بین بروند. تنظیم این پرچم باعث می‌شود که مؤلفه‌ها از بین نروند و بنابراین از ایجاد مجدد مداوم آن‌ها در صورت استفاده مکرر جلوگیری می‌کند. مثال‌هایی از این مؤلفه‌ها ممکن است سرویس‌های EventHandler باشند. مقدار پیش‌فرض از بین بردن مؤلفه‌های استفاده نشده است.
ds-factory-enabled=مؤلفه‌های کارخانه توسعه یافته
ds-factory-enabled-help=پیکربندی کنید که آیا پشتیبانی از ایجاد نمونه‌های مؤلفه‌های کارخانه بر اساس پیکربندی کارخانه فعال شود یا خیر. این یک توسعه خاص Apache Felix SCR است که به طور صریح توسط مشخصات خدمات اعلانی پشتیبانی نمی‌شود. تکیه بر این ویژگی مانع از استفاده از مؤلفه با سایر پیاده‌سازی‌های خدمات اعلانی می‌شود. مقدار پیش‌فرض false است تا این ویژگی غیرفعال شود.
ds-global-extender=گسترش دهنده سراسری
ds-global-extender-help=پیکربندی کنید که آیا همه بسته‌ها، چه برای این بسته قابل مشاهده باشند یا نباشند، به این بسته گسترش داده شوند یا خیر.
ds-lock-timeout-milliseconds=مهلت زمانی قفل (میلی‌ثانیه)
ds-lock-timeout-milliseconds-help=پیکربندی کنید که قفل چه مدت قبل از رها شدن به دلیل مشکوک بودن به بن‌بست، نگه داشته شود.
ds-loglevel=سطح ورود به سیستم SCR
ds-loglevel-help=سطح ورود به سیستم را برای محدود کردن میزان اطلاعات ورود به سیستم ارسال شده به OSGi LogService پیکربندی کنید. مقادیر پشتیبانی شده عبارتند از DEBUG، INFO، WARN و ERROR. اگر یک پیاده‌سازی R7 LogService در دسترس باشد، این ویژگی استفاده نمی‌شود، زیرا سطح ورود به سیستم را می‌توان از طریق آن سرویس پیکربندی کرد. مقدار پیش‌فرض ERROR است.
ds-stop-timeout-milliseconds=مهلت زمانی توقف (میلی‌ثانیه)
ds-stop-timeout-milliseconds-help=پیکربندی کنید که چه مدت قبل از ادامه به دلیل مشکوک بودن به بن‌بست، منتظر توقف یک بسته بمانید.
felix-fileinstall-bundles-new-start=شروع بسته‌های جدید
felix-fileinstall-bundles-startActivationPolicy=هنگام شروع، از سیاست فعال‌سازی بسته استفاده کنید
felix-fileinstall-bundles-startTransient=بسته‌ها را به‌طور گذرا شروع کنید
felix-fileinstall-dir=دایرکتوری نظرسنجی
felix-fileinstall-filter=فیلتر نام فایل
felix-fileinstall-log-level=سطح ورود به سیستم
felix-fileinstall-noInitialDelay=بدون تأخیر اولیه
felix-fileinstall-poll=فاصله نظرسنجی
felix-fileinstall-start-level=سطح شروع بسته‌ها
felix-fileinstall-tmpdir=دایرکتوری موقت
org-apache-felix-eventadmin-AsyncToSyncThreadRatio=نسبت ریسمان‌های ناهمزمان/همزمان
org-apache-felix-eventadmin-AsyncToSyncThreadRatio-help=نسبت ریسمان‌های ناهمزمان به همزمان را در استخر ریسمان داخلی پیکربندی کنید. نسبت باید مثبت باشد و ممکن است برای نشان دادن توزیع عملیات ارسال به ارسال تنظیم شود. برنامه‌های کاربردی با تعداد بیشتری از عملیات ارسال باید نسبت بالاتری داشته باشند.
org-apache-felix-eventadmin-IgnoreTimeout=نادیده گرفتن مهلت‌های زمانی
org-apache-felix-eventadmin-IgnoreTimeout-help=هندلر‌های رویداد را برای فراخوانی بدون مهلت زمانی پیکربندی کنید. اگر به طور پیش فرض مهلت زمانی پیکربندی شده باشد، همه هندلر‌های رویداد با استفاده از مهلت زمانی فراخوانی می‌شوند. برای بهینه‌سازی عملکرد، می‌توان هندلر‌های رویداد را پیکربندی کرد که در آن‌ها از مدیریت مهلت زمانی استفاده نمی‌شود. این کار استفاده از ریسمان‌ها را از استخر‌های ریسمان کاهش می‌دهد، زیرا مدیریت مهلت زمانی به یک ریسمان اضافی برای فراخوانی هندلر رویداد نیاز دارد. با این حال، برنامه باید بدون این ویژگی پیکربندی کار کند. این یک بهینه‌سازی خالص است. مقدار یک لیست از رشته‌ها است. اگر یک رشته با یک نقطه به پایان برسد، همه هندلر‌ها دقیقاً در این بسته نادیده گرفته می‌شوند. اگر رشته با یک ستاره به پایان برسد، همه هندلر‌ها در این بسته و همه زیر بسته‌ها نادیده گرفته می‌شوند. اگر رشته نه با یک نقطه و نه با یک ستاره به پایان برسد، فرض بر این است که یک نام کلاس دقیق را تعریف می‌کند.
org-apache-felix-eventadmin-IgnoreTopic=نادیده گرفتن موضوعات
org-apache-felix-eventadmin-IgnoreTopic-help=موضوعاتی را که توسط پیاده‌سازی مدیریت رویداد برای بهینه‌سازی عملکرد نادیده گرفته می‌شوند، پیکربندی کنید. در این حالت، یک رویداد به هندلر‌های رویداد ثبت شده تحویل داده نمی‌شود. مقدار یک لیست از رشته‌ها است (که با کاما از هم جدا شده‌اند). اگر یک مقدار واحد با یک نقطه به پایان برسد، همه موضوعات دقیقاً در این بسته نادیده گرفته می‌شوند. اگر یک مقدار واحد با یک ستاره به پایان برسد، همه موضوعات در این بسته و همه زیر بسته‌ها نادیده گرفته می‌شوند. اگر یک مقدار واحد نه با یک نقطه و نه با یک ستاره به پایان برسد، فرض بر این است که یک موضوع دقیق را تعریف می‌کند. از یک ستاره واحد می‌توان برای غیرفعال کردن کامل تحویل استفاده کرد.
org-apache-felix-eventadmin-RequireTopic=موضوع مورد نیاز است
org-apache-felix-eventadmin-RequireTopic-help=پیکربندی کنید که آیا هندلر‌های رویداد باید با یک موضوع ثبت شوند یا خیر. این به طور پیش فرض فعال است. مشخصات می‌گوید که هندلر‌های رویداد باید با لیستی از موضوعاتی که به آن‌ها علاقه مند هستند ثبت نام کنند. غیرفعال کردن این تنظیم باعث می‌شود که هندلر‌های بدون موضوع همه رویداد‌ها را دریافت کنند (یعنی با یک موضوع=* یکسان تلقی می‌شوند).
org-apache-felix-eventadmin-ThreadPoolSize=اندازه استخر ریسمان
org-apache-felix-eventadmin-ThreadPoolSize-help=اندازه استخر ریسمانی را که برای تحویل رویداد استفاده می‌شود پیکربندی کنید. مقدار پیش فرض 20 است. در صورت وجود تعداد زیادی رویداد افزایش دهید. مقداری کمتر از 1 مقدار پیش فرض را فعال می‌کند. اگر استخر تمام شود، تحویل رویداد تا زمانی که یک ریسمان از استخر در دسترس قرار گیرد مسدود می‌شود. هر رویداد در یک ریسمان از استخر تحویل داده می‌شود، مگر اینکه مهلت‌های زمانی نادیده گرفتن برای هندلر رویداد دریافت کننده پیکربندی شده باشد.
org-apache-felix-eventadmin-Timeout=مهلت زمانی
org-apache-felix-eventadmin-Timeout-help=مهلت زمانی لیست سیاه را بر حسب میلی‌ثانیه پیکربندی کنید. مقدار پیش فرض 5000 است. به اختیار خود افزایش یا کاهش دهید. مقداری کمتر از 100 مهلت‌های زمانی را خاموش می‌کند. هر مقدار دیگری زمانی بر حسب میلی‌ثانیه است که به هر هندلر رویداد قبل از قرار گرفتن در لیست سیاه داده می‌شود.
org-apache-felix-eventadmin-ocd-help=پیکربندی برای پیاده‌سازی مدیریت رویداد Apache Felix. این پیکربندی، پیکربندی تعریف شده در ویژگی‌های چارچوب با همین نام‌ها را بازنویسی می‌کند.
org-apache-felix-eventadmin-ocd-name=پیاده‌سازی مدیریت رویداد Apache Felix
org-apache-felix-fileinstall-ocd-name=نصب فایل Apache Felix
org-apache-felix-scr-ScrService-ocd-help=پیاده‌سازی خدمات اعلانی Apache Felix را پیکربندی کنید. این پیکربندی، پیکربندی تعریف شده در ویژگی‌های چارچوب با همین نام‌ها را بازنویسی می‌کند.
org-apache-felix-scr-ScrService-ocd-name=پیاده‌سازی سرویس اعلانی Apache Felix
