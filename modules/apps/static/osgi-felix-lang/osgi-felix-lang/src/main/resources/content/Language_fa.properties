ds-delayed-keepInstances=نمونه های مولفه را نگه دارید
ds-delayed-keepInstances-help=پیکربندی کنید که آیا نمونه‌های مولفه‌های تاخیری پس از اینکه دیگر به آنها ارجاع داده نمی‌شوند، نگهداری شوند یا خیر. مشخصات سرویس‌های اعلانی پیشنهاد می‌کند که نمونه‌های مولفه‌های تاخیری در صورت عدم استفاده طولانی‌تر، حذف شوند. تنظیم این پرچم باعث می‌شود که مولفه‌ها حذف نشوند و بنابراین از ایجاد مجدد مداوم آنها در صورت استفاده مکرر جلوگیری شود. به عنوان مثال، چنین مولفه‌هایی می‌توانند سرویس‌های EventHandler باشند. مقدار پیش‌فرض حذف مولفه‌های استفاده نشده است.
ds-factory-enabled=مولفه‌های کارخانه گسترده
ds-factory-enabled-help=پیکربندی کنید که آیا پشتیبانی از ایجاد نمونه‌های مولفه کارخانه بر اساس پیکربندی کارخانه فعال شود یا خیر. این یک افزونه خاص Apache Felix SCR است که به طور صریح توسط مشخصات سرویس‌های اعلانی پشتیبانی نمی‌شود. اتکا به این ویژگی مانع از استفاده از این مولفه با سایر پیاده‌سازی‌های سرویس‌های اعلانی می‌شود. مقدار پیش‌فرض false است تا این ویژگی غیرفعال شود.
ds-global-extender=توسعه دهنده جهانی
ds-global-extender-help=پیکربندی کنید که آیا همه بسته‌ها، که برای این بسته قابل مشاهده هستند یا نیستند، به این بسته گسترش داده شوند یا خیر.
ds-lock-timeout-milliseconds=مهلت قفل بر حسب میلی‌ثانیه
ds-lock-timeout-milliseconds-help=مدت زمانی را که یک قفل قبل از آزاد شدن به دلیل مشکوک بودن به بن‌بست، نگه داشته می‌شود را پیکربندی کنید.
ds-loglevel=سطح ورود به سیستم SCR
ds-loglevel-help=سطح ورود به سیستم را برای محدود کردن میزان اطلاعات ورود به سیستم ارسال شده به OSGi LogService پیکربندی کنید. مقادیر پشتیبانی شده عبارتند از DEBUG، INFO، WARN و ERROR. اگر یک پیاده‌سازی R7 LogService در دسترس باشد، این ویژگی استفاده نمی‌شود، زیرا سطح ورود به سیستم را می‌توان از طریق آن سرویس پیکربندی کرد. مقدار پیش فرض ERROR است.
ds-stop-timeout-milliseconds=مهلت توقف بر حسب میلی‌ثانیه
ds-stop-timeout-milliseconds-help=مدت زمانی را که باید منتظر بمانید تا یک بسته قبل از ادامه به دلیل مشکوک بودن به بن‌بست، متوقف شود را پیکربندی کنید.
felix-fileinstall-bundles-new-start=بسته های جدید را شروع کنید
felix-fileinstall-bundles-startActivationPolicy=هنگام شروع، از سیاست فعال‌سازی بسته استفاده کنید
felix-fileinstall-bundles-startTransient=بسته ها را به صورت موقت شروع کنید
felix-fileinstall-dir=پوشه نظرسنجی
felix-fileinstall-filter=فیلتر نام فایل
felix-fileinstall-log-level=سطح ورود
felix-fileinstall-noInitialDelay=بدون تأخیر اولیه
felix-fileinstall-poll=فاصله زمانی نظرسنجی ها
felix-fileinstall-start-level=سطح شروع بسته‌ها
felix-fileinstall-tmpdir=پوشه موقت
org-apache-felix-eventadmin-AsyncToSyncThreadRatio=نسبت ریسمان ناهمزمان/همزمان
org-apache-felix-eventadmin-AsyncToSyncThreadRatio-help=نسبت ریسمان‌های ناهمزمان به همزمان را در استخر ریسمان داخلی پیکربندی کنید. نسبت باید مثبت باشد و ممکن است برای نشان دادن توزیع عملیات ارسال به ارسال تنظیم شود. برنامه‌هایی با تعداد عملیات ارسال بیشتر باید نسبت بالاتری داشته باشند.
org-apache-felix-eventadmin-IgnoreTimeout=نادیده گرفتن وقفه ها
org-apache-felix-eventadmin-IgnoreTimeout-help=مدیریت‌کننده‌های رویداد را برای فراخوانی بدون وقفه پیکربندی کنید. اگر یک وقفه به طور پیش فرض پیکربندی شده باشد، سپس همه مدیریت‌کننده‌های رویداد با استفاده از وقفه فراخوانی می‌شوند. برای بهینه سازی عملکرد، می‌توان مدیریت‌کننده‌های رویداد را پیکربندی کرد که در آنها از مدیریت وقفه استفاده نمی‌شود. این امر باعث کاهش استفاده از ریسمان از استخرهای ریسمان می‌شود، زیرا مدیریت وقفه به یک ریسمان اضافی برای فراخوانی مدیریت‌کننده رویداد نیاز دارد. با این حال، برنامه باید بدون این ویژگی پیکربندی کار کند. این یک بهینه سازی خالص است. مقدار یک لیست از رشته‌ها است. اگر یک رشته به یک نقطه ختم شود، همه مدیریت‌کننده‌ها در دقیقاً این بسته نادیده گرفته می‌شوند. اگر رشته به یک ستاره ختم شود، همه مدیریت‌کننده‌ها در این بسته و همه زیر بسته‌ها نادیده گرفته می‌شوند. اگر رشته نه به یک نقطه و نه به یک ستاره ختم شود، فرض بر این است که یک نام کلاس دقیق را تعریف می‌کند.
org-apache-felix-eventadmin-IgnoreTopic=نادیده گرفتن موضوعات
org-apache-felix-eventadmin-IgnoreTopic-help=موضوعاتی را پیکربندی کنید که توسط پیاده سازی مدیریت رویداد برای بهینه سازی عملکرد نادیده گرفته می‌شوند. در این حالت، یک رویداد به مدیریت‌کننده‌های رویداد ثبت شده تحویل داده نمی‌شود. مقدار یک لیست از رشته‌ها است (جدا شده با کاما). اگر یک مقدار واحد به یک نقطه ختم شود، همه موضوعات در دقیقاً این بسته نادیده گرفته می‌شوند. اگر یک مقدار واحد به یک ستاره ختم شود، همه موضوعات در این بسته و همه زیر بسته‌ها نادیده گرفته می‌شوند. اگر یک مقدار واحد نه به یک نقطه و نه به یک ستاره ختم شود، فرض بر این است که یک موضوع دقیق را تعریف می‌کند. یک ستاره واحد می‌تواند برای غیرفعال کردن کامل تحویل استفاده شود.
org-apache-felix-eventadmin-RequireTopic=موضوع مورد نیاز
org-apache-felix-eventadmin-RequireTopic-help=پیکربندی کنید که آیا مدیریت‌کننده‌های رویداد ملزم به ثبت نام با یک موضوع هستند یا خیر. این به طور پیش فرض فعال است. مشخصات می‌گوید که مدیریت‌کننده‌های رویداد باید با یک لیست از موضوعاتی که به آنها علاقه مند هستند ثبت نام کنند. غیرفعال کردن این تنظیم باعث می‌شود که مدیریت‌کننده‌ها بدون موضوع، همه رویدادها را دریافت کنند (یعنی آنها همانند یک موضوع=* در نظر گرفته می‌شوند).
org-apache-felix-eventadmin-ThreadPoolSize=اندازه استخر ریسمان
org-apache-felix-eventadmin-ThreadPoolSize-help=اندازه استخر ریسمانی را که برای تحویل رویداد استفاده می‌شود پیکربندی کنید. مقدار پیش فرض 20 است. در صورت مقدار زیاد رویدادها، افزایش دهید. مقدار کمتر از 2 مقدار پیش فرض را فعال می‌کند. اگر استخر تمام شود، تحویل رویداد تا زمانی که یک ریسمان از استخر در دسترس قرار گیرد، مسدود می‌شود. هر رویداد در یک ریسمان از استخر تحویل داده می‌شود، مگر اینکه وقفه ها برای مدیریت‌کننده رویداد گیرنده نادیده گرفته شود.
org-apache-felix-eventadmin-Timeout=مهلت
org-apache-felix-eventadmin-Timeout-help=مهلت لیست سیاه را بر حسب میلی‌ثانیه پیکربندی کنید. مقدار پیش فرض 5000 است. افزایش یا کاهش با اختیار خود. مقدار کمتر از 100 مهلت ها را خاموش می‌کند. هر مقدار دیگری زمان به میلی‌ثانیه است که به هر مدیریت‌کننده رویداد قبل از لیست سیاه شدن آن اعطا می‌شود.
org-apache-felix-eventadmin-ocd-help=برای پیاده سازی Apache Felix Event Admin پیکربندی کنید. این پیکربندی پیکربندی تعریف شده در ویژگی‌های چارچوب با همان نام را بازنویسی می‌کند.
org-apache-felix-eventadmin-ocd-name=پیاده‌سازی مدیریت رویداد Apache Felix
org-apache-felix-fileinstall-ocd-name=نصب فایل Apache Felix
org-apache-felix-scr-ScrService-ocd-help=پیاده سازی Apache Felix Declarative Services را پیکربندی کنید. این پیکربندی پیکربندی تعریف شده در ویژگی‌های چارچوب با همان نام را بازنویسی می‌کند.
org-apache-felix-scr-ScrService-ocd-name=پیاده‌سازی سرویس اعلانی Apache Felix