layout-converter-configuration-verified-layout-template-ids-description=تغییر صفحات ویجت با استفاده از هر یک از این قالب‌های طرح‌بندی به‌درستی کار می‌کند. برای بقیه موارد، هنگام ورود به پیش‌نمایش پس از انجام تبدیل، یک هشدار نمایش داده می‌شود.
layout-crawler-client-configuration-description=جزئیات اتصال مورد استفاده توسط سرویس گیرنده خزنده طرح‌بندی را برای بازیابی صفحات محتوا برای فهرست‌بندی پیکربندی کنید. با استفاده از این پیکربندی، خزنده طرح‌بندی می‌تواند از حافظه پنهان، CDN و سیستم‌های SSO عبور کند تا محتوای فهرست‌پذیر را مستقیماً از سرور برنامه بازیابی کند.
layout-crawler-client-configuration-enabled-description=هنگامی که پیکربندی سرویس گیرنده خزنده طرح‌بندی فعال باشد، نمونه از این جزئیات اتصال برای بازیابی یک صفحه محتوا برای فهرست‌بندی استفاده می‌کند.
layout-crawler-client-configuration-hostname-description=نام میزبان یا آدرس IP را برای اتصال مشخص کنید.
layout-crawler-client-configuration-name=پیکربندی سرویس گیرنده خزنده طرح‌بندی
layout-crawler-client-configuration-port-description=پورتی را که می‌خواهید به آن متصل شوید را مشخص کنید.
layout-crawler-client-configuration-secure-description=برای استفاده از اتصال HTTPS علامت بزنید. در غیر این صورت، از اتصال HTTP استفاده خواهد شد.
secure=امن
this-page-has-customizable-columns.-this-capability-is-not-supported-for-content-pages-and-will-be-lost-if-the-conversion-draft-is-published=این صفحه دارای ستون‌های قابل تنظیم است. این قابلیت برای صفحات محتوا پشتیبانی نمی‌شود و در صورت انتشار پیش‌نویس تبدیل، از بین می‌رود.
this-page-uses-a-custom-page-layout.-a-best-effort-conversion-has-been-performed.-verify-the-conversion-draft-before-publishing-it=این صفحه از طرح‌بندی سفارشی صفحه استفاده می‌کند. یک تبدیل با بهترین تلاش انجام شده است. پیش‌نویس تبدیل را قبل از انتشار بررسی کنید.
this-page-uses-a-custom-page-layout.-all-widgets-have-been-placed-in-a-single-column-and-will-require-manual-reorganization=این صفحه از طرح‌بندی سفارشی صفحه استفاده می‌کند. همه ویجت‌ها در یک ستون واحد قرار گرفته‌اند و نیاز به سازماندهی مجدد دستی دارند.
this-page-uses-nested-applications-widgets.-they-have-been-placed-in-a-single-column-and-may-require-manual-reorganization=این صفحه از ویجت‌های برنامه‌های تودرتو استفاده می‌کند. همه ویجت‌هایی که در داخل یک ویجت برنامه تودرتو بودند در یک ستون واحد قرار گرفته‌اند و ممکن است نیاز به سازماندهی مجدد دستی داشته باشند.
verified-layout-template-ids=شناسه‌های قالب طرح‌بندی تأییدشده