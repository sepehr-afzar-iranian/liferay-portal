allow-site-administrators-to-modify-pages-associated-with-this-site-template=به مدیران سایت اجازه دهید صفحه‌های مرتبط با این قالب سایت را تغییر دهند، حتی زمانی که انتشار تغییرات فعال است.
allow-site-administrators-to-modify-pages-associated-with-this-site-template-help=این گزینه را تنظیم کنید تا به مدیران سایت اجازه دهید برنامه‌ها را اضافه، حذف یا پیکربندی کنند و ویژگی‌های صفحه را تغییر دهند. اگر مدیران سایت صفحه‌ای را تغییر دهند، تغییرات در صفحه قالب سایت اصلی دیگر منتشر نمی‌شوند. اگر این گزینه تنظیم شده باشد، می‌توان از طریق ابزار مدیریت صفحه، از ایجاد تغییرات در صفحات خاص جلوگیری کرد.
javax.portlet.description.com_liferay_layout_set_prototype_web_portlet_LayoutSetPrototypePortlet=قالب‌های سایت به شما امکان می‌دهند صفحات و محتوای وب را برای گنجاندن هنگام ایجاد سایت‌ها تعریف کنید. شما می‌توانید قالب‌های سایت و همچنین مجوزهای آن‌ها را تعریف و ویرایش کنید.
javax.portlet.title.com_liferay_layout_set_prototype_web_portlet_LayoutSetPrototypePortlet=قالب‌های سایت
