frontend-js-lodash-description=فعال‌سازی Lodash این کتابخانه را در شی سراسری به عنوان window._ و همچنین AUI._ در فضای نام AlloyUI در دسترس قرار می‌دهد. اگر به وجود این کتابخانه به صورت سراسری یا متصل به شی AUI نیاز دارید، این تنظیمات را فعال کنید. برای اعمال تغییرات ایجاد شده در اینجا، پس از ذخیره باید صفحه مرورگر را دوباره بارگیری کنید.