enable-jquery=فعال‌سازی JQuery
frontend-js-jquery-configuration-name=JQuery
frontend-js-jquery-description=فعال کردن JQuery این کتابخانه را در ابجکت سراسری با نام window.$ و همچنین AUI.$ در فضای نام AlloyUI در دسترس قرار می دهد. اگر به وجود این کتابخانه در سطح سراسری یا پیوست شده به ابجکت AUI وابسته هستید، این تنظیمات را فعال کنید. برای اعمال تغییرات ایجاد شده، پس از ذخیره باید صفحه مرورگر را مجدداً بارگذاری کنید.
