enable-jquery=JQuery را فعال کنید
frontend-js-jquery-configuration-name=JQuery
frontend-js-jquery-description=فعال کردن JQuery این کتابخانه را در شیء سراسری با نام window.$ و همچنین AUI.$ در فضای نام AlloyUI در دسترس قرار می‌دهد. اگر به وجود این کتابخانه به صورت سراسری یا متصل به شیء AUI وابسته هستید، این تنظیمات را فعال کنید. برای اعمال تغییرات، پس از ذخیره باید صفحه مرورگر را دوباره بارگیری کنید.