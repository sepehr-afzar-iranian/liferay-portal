cache-expiration-time-description=مدت زمانی را بر حسب دقیقه مشخص کنید که کش SPA پاک می شود. اگر نباید کش در طول ناوبری SPA منقضی شود، از مقدار صفر استفاده کنید. اگر کش باید غیرفعال شود، از مقدار منفی استفاده کنید.
cache-expiration-time-name=زمان انقضا حافظه جانبی
custom-excluded-paths-description=مسیرهای سفارشی را که SPA باید نادیده بگیرد تعریف کنید.
custom-excluded-paths-name=مسیرهای مستثنی سفارشی
disable-in-internet-explorer=غیرفعال کردن SPA در اینترنت اکسپلورر
disable-in-internet-explorer-11=غیرفعال کردن SPA در اینترنت اکسپلورر 11
disable-in-internet-explorer-11-description=با توجه به یک باگ در موتور رندر Trident (مورد استفاده توسط IE11)، هنگامی که SPA برای ناوبری صفحه استفاده می شود، media queries همیشه اعمال می شوند، وقتی که فقط min-width یا فقط max-width queries مشخص شده باشند، حتی اگر عرض صفحه با آن queries مطابقت نداشته باشد. این مشکل بر روی third-party iframes در صفحه نیز تأثیر می گذارد. برای رفع این مشکل، SPA را غیرفعال کنید.
disable-in-internet-explorer-description=به منظور حل یک اشکال در موتور رندر Trident (مورد استفاده توسط IE11) و موتور رندر MSHTML (مورد استفاده توسط Edge)، رندر صحیح صفحه با SPA در حال حاضر نیاز به بارگیری مجدد تمام فایل های CSS در تمام ناوبری های صفحه برای همه مرورگرهای Internet Explorer دارد، که می تواند باعث شود صفحات با SPA فعال آهسته تر از SPA غیرفعال بارگیری شوند. برای رفع این مشکل، SPA را غیرفعال کنید.
it-looks-like-this-is-taking-longer-than-expected=به نظر می رسد این کار بیشتر از حد انتظار طول می کشد.
navigation-exception-selectors-description=انتخابگرهای CSS را که SPA باید نادیده بگیرد تعریف کنید.
navigation-exception-selectors-name=انتخابگرهای استثنا ناوبری
oops=متاسفیم
request-timeout-description=مدت زمانی را بر حسب میلی ثانیه مشخص کنید که یک درخواست SPA منقضی می شود. اگر نباید درخواست منقضی شود، از مقدار صفر استفاده کنید.
request-timeout-name=حداکثر زمان مجاز گذشت
spa-configuration-description=برای اعمال تغییرات ایجاد شده در اینجا، باید پس از ذخیره صفحه مرورگر را دوباره بارگیری کنید.
spa-configuration-name=زیرساخت ظاهری
the-spa-navigation-request-received-an-invalid-http-status-code=درخواست ناوبری SPA یک کد وضعیت HTTP نامعتبر دریافت کرد.
the-spa-request-timed-out=درخواست SPA منقضی شد.
there-was-an-unexpected-error-in-the-spa-request=درخواست SPA با یک خطای غیر منتظره روبرو شد.
user-notification-timeout-description=مدت زمانی را بر حسب میلی ثانیه مشخص کنید که یک اعلان به کاربر نشان داده می شود که بیان می کند درخواست بیشتر از حد انتظار طول می کشد. اگر نباید هیچ اعلانی نشان داده شود، از مقدار صفر استفاده کنید.
user-notification-timeout-name=زمان انتظار اعلان کاربر