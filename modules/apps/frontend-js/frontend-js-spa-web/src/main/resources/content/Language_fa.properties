cache-expiration-time-description=مدت زمانی را بر حسب دقیقه تعیین کنید که حافظه پنهان SPA پاک می‌شود. اگر نباید حافظه پنهان هرگز در طول مسیریابی SPA منقضی شود، از مقدار صفر استفاده کنید. اگر باید حافظه پنهان غیرفعال شود، از مقدار منفی استفاده کنید.
cache-expiration-time-name=مدت زمان انقضای حافظه پنهان
custom-excluded-paths-description=مسیرهای سفارشی را تعریف کنید که SPA باید نادیده بگیرد.
custom-excluded-paths-name=مسیرهای مستثنی سفارشی
disable-in-internet-explorer=غیرفعال کردن SPA در اینترنت اکسپلورر
disable-in-internet-explorer-11=غیرفعال کردن SPA در اینترنت اکسپلورر 11
disable-in-internet-explorer-11-description=به دلیل یک اشکال در موتور رندر Trident (مورد استفاده توسط IE11)، زمانی که SPA برای پیمایش صفحه استفاده می‌شود، پرس‌وجوهای رسانه‌ای همیشه اعمال می‌شوند، در صورتی که فقط پرس‌وجوهای min-width یا max-width مشخص شده باشند، حتی اگر عرض صفحه با آن پرس‌وجوها مطابقت نداشته باشد. این موضوع بر iframe های شخص ثالث در صفحه نیز تأثیر می‌گذارد. برای حل این مشکل، SPA را غیرفعال کنید.
disable-in-internet-explorer-description=به منظور رفع اشکال در موتور رندر Trident (مورد استفاده توسط IE11) و موتور رندر MSHTML (مورد استفاده توسط Edge)، رندر صحیح صفحه با SPA در حال حاضر نیاز به بارگیری مجدد تمام فایل‌های CSS در تمام پیمایش‌های صفحه برای همه مرورگرهای اینترنت اکسپلورر دارد، که می‌تواند باعث شود صفحات با فعال بودن SPA کندتر از حالت غیرفعال بودن SPA بارگیری شوند. برای حل این مشکل، SPA را غیرفعال کنید.
it-looks-like-this-is-taking-longer-than-expected=به نظر می‌رسد این کار بیشتر از حد انتظار طول می‌کشد.
navigation-exception-selectors-description=انتخابگرهای CSS را که SPA باید نادیده بگیرد، تعریف کنید.
navigation-exception-selectors-name=انتخابگرهای استثنای پیمایش
oops=اوه!
request-timeout-description=مدت زمانی را بر حسب میلی‌ثانیه تعیین کنید که یک درخواست SPA منقضی می‌شود. اگر نباید درخواست هرگز منقضی شود، از مقدار صفر استفاده کنید.
request-timeout-name=مدت زمان Timeout درخواست
spa-configuration-description=برای اعمال تغییرات ایجاد شده در اینجا، پس از ذخیره باید صفحه مرورگر را دوباره بارگیری کنید.
spa-configuration-name=زیرساخت SPA فرانت‌اند
the-spa-navigation-request-received-an-invalid-http-status-code=درخواست پیمایش SPA یک کد وضعیت HTTP نامعتبر دریافت کرد.
the-spa-request-timed-out=درخواست SPA منقضی شد.
there-was-an-unexpected-error-in-the-spa-request=در درخواست SPA یک خطای غیرمنتظره رخ داد.
user-notification-timeout-description=مدت زمانی را بر حسب میلی‌ثانیه تعیین کنید که یک اعلان به کاربر نشان داده می‌شود که بیان می‌کند درخواست بیشتر از حد انتظار طول می‌کشد. اگر نباید هیچ اعلانی نشان داده شود، از مقدار صفر استفاده کنید.
user-notification-timeout-name=مدت زمان Timeout اعلان کاربر
