a-map-should-be-shown-here=یک نقشه باید در اینجا نشان داده شود. طفا با مدیر پورتال تماس گرفته و یا از مارکت لایفری یک ارائه‌دهنده نقشه نصب نمایید.
select-the-maps-api-provider-to-use-when-displaying-geolocalized-assets=ارائه‌دهنده API نقشه را برای استفاده در هنگام نمایش دارایی‌های موقعیت جغرافیایی انتخاب کنید.