previewable-processor-max-size-help=حداکثر اندازه فایل را برای پیش‌نمایش و تولید تصویر کوچک تعیین کنید. فایل‌های بزرگتر از مقدار مشخص شده در این ویژگی منجر به اجرای پردازشگری که یک پیش‌نمایش تولید می‌کند، نخواهند شد. مقدار 1- نشان می‌دهد که همه فایل‌ها پردازش می‌شوند. مقدار 0 نشان می‌دهد که هیچ فایلی پردازش نخواهد شد. حداکثر اندازه پیش‌فرض 100 مگابایت است.
