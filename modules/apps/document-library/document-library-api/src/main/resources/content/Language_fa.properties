file-max-size-help=حداکثر اندازه فایل و پسوندهای فایل معتبر را برای اسناد تنظیم کنید. مقدار 0 برای حداکثر اندازه فایل می‌تواند برای نشان دادن اندازه فایل نامحدود استفاده شود. با این حال، حداکثر اندازه مجاز فایل توسط ویژگی "حداکثر اندازه کلی درخواست آپلود" در پیکربندی "درخواست آپلود Servlet" تنظیم شده است.
