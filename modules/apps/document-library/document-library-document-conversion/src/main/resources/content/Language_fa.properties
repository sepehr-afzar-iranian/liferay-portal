openoffice-server-enabled-help=فعال کردن ادغام OpenOffice به اسناد و رسانه و ویکی اجازه می‌دهد تا قابلیت تبدیل را فراهم کنند. این با OpenOffice 4.1.x آزمایش شده است. توصیه می‌شود OpenOffice را روی همان دستگاه داشته باشید. استفاده از یک میزبان راه دور برای نمونه به طور کامل پشتیبانی نمی‌شود و می‌تواند منجر به مشکلات مختلفی شود. برای شروع OpenOffice به عنوان سرویس، دستور زیر را اجرا کنید: soffice -headless -accept="socket,host=127.0.0.1,port=8100;urp;"
