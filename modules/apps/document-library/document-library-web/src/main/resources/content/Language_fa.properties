you-now-have-an-indefinite-lock-on-this-document=اکنون یک قفل نامحدود روی این سند دارید. هیچ کس دیگری نمی تواند این سند را ویرایش کند تا زمانی که آن را باز کنید. این قفل هرگز منقضی نخواهد شد.
