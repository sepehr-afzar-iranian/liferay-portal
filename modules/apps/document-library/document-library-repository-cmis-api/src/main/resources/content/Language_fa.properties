cmis-repository-configuration-name=پیکربندی مخزن CMIS
delete-depth-description=عمق ورودی‌های CMIS نگاشت‌شده را برای حذف شدن هنگام فراخوانی حذف از درون پورتال تعیین کنید. هرچه این تنظیم عمیق‌تر باشد، تماس‌های بیشتری با سرور مورد نیاز است. هنگامی که یک حذف از خارج از پورتال فراخوانی می‌شود، ورودی‌های CMIS نگاشت‌شده در پایگاه داده ثابت باقی می‌مانند. مقادیر مورد انتظار عبارتند از: -1 برای عمیق، 0 برای هیچکدام و 1 برای کم‌عمق.
delete-depth-name=عمق حذف
