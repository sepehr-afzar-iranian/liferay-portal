custom-user-attributes=ویژگی‌های سفارشی کاربر
custom-user-attributes-help=تعیین ویژگی‌های سفارشی کاربر، دارایی‌هایی را بازیابی می‌کند که دارای دسته‌بندی منطبق هستند. دسته‌ها باید از زمینه سراسری باشند.
displayed-assets-must-match-these-custom-user-profile-attributes=دارایی‌های نمایش داده شده باید با این ویژگی‌های سفارشی پروفایل کاربر مطابقت داشته باشند.
