visibility-help=هنگامی که دید به داخلی تنظیم می شود، واژگان در صفحات، چه از طریق ویجت ها، تکه ها، و چه نقشه برداری محتوا نمایش داده نمی شود و تنها می تواند برای جستجوها و دسته بندی های داخلی مورد استفاده قرار گیرد. پیکربندی دید را نمی توان بازگشت. (Automatic Translation)
