combine-assets-from-all-segments-in-asset-publisher-dynamic-description=انتشاردهنده دارایی که در حالت مجموعه پویا پیکربندی شده است، ورودی‌های مجموعه را از تمام بخش‌های مربوط به کاربر فعلی ترکیب می‌کند، نه فقط از مرتبط‌ترین آن‌ها به طور پیش‌فرض. تنظیم این گزینه به true ممکن است باعث شود که انتشاردهنده دارایی هنگام نمایش دارایی‌ها برای کاربری که به بسیاری از بخش‌ها تعلق دارد، واکنش تاخیری نشان دهد.
combine-assets-from-all-segments-in-asset-publisher-manual=ترکیب دارایی‌ها از تمام بخش‌ها در انتشاردهنده دارایی برای مجموعه‌های دستی
