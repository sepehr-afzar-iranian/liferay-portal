asset-list-configuration-name=مجموعه ها
combine-assets-from-all-segments-in-asset-publisher-dynamic=ترکیب دارایی‌ها از تمام بخش‌ها در Asset Publisher برای مجموعه‌های پویا
combine-assets-from-all-segments-in-asset-publisher-dynamic-description=Asset Publisher که در حالت مجموعه پویا پیکربندی شده است، ورودی‌های مجموعه را از تمام بخش‌های مربوط به کاربر فعلی ترکیب می‌کند، نه فقط از مرتبط‌ترین بخش، همانطور که به طور پیش فرض است. تنظیم این گزینه روی true ممکن است باعث شود Asset Publisher هنگام نشان دادن دارایی‌ها برای کاربری که متعلق به بسیاری از بخش‌ها است، تأخیر نشان دهد.
combine-assets-from-all-segments-in-asset-publisher-manual=ترکیب دارایی‌ها از تمام بخش‌ها در Asset Publisher برای مجموعه‌های دستی
combine-assets-from-all-segments-in-asset-publisher-manual-description=Asset Publisher که در حالت مجموعه دستی پیکربندی شده است، ورودی‌های مجموعه را از تمام بخش‌های مربوط به کاربر فعلی ترکیب می‌کند، نه فقط از مرتبط‌ترین بخش، همانطور که به طور پیش فرض است.
