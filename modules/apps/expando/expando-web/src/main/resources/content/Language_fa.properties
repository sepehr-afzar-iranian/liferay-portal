custom-field-display-type-help=نوع کنترلی که برای تنظیم این فیلد استفاده می شود را مشخص کنید.
custom-field-height-help=این مقدار ارتفاع فیلد ورودی را بر حسب پیکسل تنظیم می کند.
custom-field-hidden-help=مخفی کردن یک فیلد سفارشی به این معنی است که مقدار فیلد در هیچ رابط کاربری به جز این یکی نشان داده نمی شود. این به فیلد اجازه می دهد تا برای اهداف مبهم و پیشرفته تر مانند عمل کردن به عنوان یک نگهدارنده برای مجوزهای سفارشی استفاده شود.
custom-field-index-type-help=تنظیم یک فیلد سفارشی به صورت قابل جستجو به این معنی است که مقدار فیلد هنگام تغییر موجودیت (مانند کاربر) فهرست بندی می شود. فقط فیلدهای java.lang.String را می توان قابل جستجو کرد. توجه داشته باشید که وقتی یک فیلد به تازگی قابل جستجو می شود، قبل از اینکه داده ها برای جستجو در دسترس باشند، باید فهرست ها به روز شوند.
custom-field-key-help=کلید فیلد سفارشی برای دسترسی به فیلد از طریق تگ {0} به صورت برنامه نویسی استفاده می شود.
custom-field-localize-field-name-help=تنظیم یک فیلد سفارشی به نام فیلد قابل ترجمه به این معنی است که نام فیلد مطابق با کلیدهای زبان تعریف شده در فایل ویژگی های زبان، ترجمه می شود. برای لغو کلیدهای زبان پیش فرض به مستندات مراجعه کنید.
custom-field-precision-help=Precision طول عدد را تنظیم می کند.
custom-field-secret-help=تنظیم یک فیلد سفارشی به صورت مخفی به این معنی است که تایپ روی صفحه پنهان است. از این برای رمز عبورها استفاده کنید.
custom-field-visible-with-update-permission-help=تنظیم یک فیلد سفارشی به صورت قابل مشاهده با مجوز به روز رسانی به این معنی است که کاربری که مجوز به روز رسانی دارد می تواند این فیلد را مشاهده کند. این تنظیم در این مورد مقدار پنهان را لغو می کند.
custom-fields-are-not-enabled-for-any-resource=فیلدهای سفارشی برای هیچ منبعی فعال نشده اند.
