captcha-engine=موتور CAPTCHA
captcha-engine-help=موتور مورد استفاده برای تولید کپچا را تنظیم کنید. reCAPTCHA از یک سرویس خارجی استفاده می‌کند که باید به طور مستقل پیکربندی شود، اما یک جایگزین صوتی ارائه می‌دهد که کپچا را برای افراد کم‌بینا قابل دسترس می‌کند. برای اطلاعات بیشتر به https://www.google.com/recaptcha/admin/create مراجعه کنید.
create-account-captcha-enabled=فعال بودن CAPTCHA در ایجاد حساب کاربری
max-challenges=حداکثر تعداد تلاش
max-challenges-help=حداکثر تعداد بررسی‌های کپچا در هر جلسه پورتلت را تنظیم کنید. برای بررسی همیشگی، این مقدار را روی 0 تنظیم کنید. برای عدم بررسی، این مقدار را روی عددی کمتر از 0 تنظیم کنید. در صورت فعال بودن بررسی کپچا، کاربران غیرمجاز همیشه در هر درخواست بررسی می‌شوند.
message-boards-edit-category-captcha-enabled=فعال بودن CAPTCHA در ویرایش دسته در تالارهای گفتگو
message-boards-edit-message-captcha-enabled=فعال بودن CAPTCHA در ویرایش پیام در تالارهای گفتگو
recaptcha-no-script-url=آدرس reCAPTCHA بدون اسکریپت
recaptcha-private-key=کلید خصوصی reCAPTCHA
recaptcha-public-key=کلید عمومی reCAPTCHA
recaptcha-script-url=آدرس اسکریپت reCAPTCHA
recaptcha-verify-url=آدرس تأیید reCAPTCHA
send-password-captcha-enabled=فعال بودن CAPTCHA در ارسال رمز عبور
simple-captcha-background-producers=تولیدکنندگان پس‌زمینه CAPTCHA ساده
simple-captcha-background-producers-help=نام کلاس‌هایی را وارد کنید که nl.captcha.backgrounds.BackgroundProducer را پیاده‌سازی می‌کنند. این کلاس‌ها به طور تصادفی توسط Simple CAPTCHA برای تولید پس‌زمینه برای تصویر کپچا استفاده می‌شوند.
simple-captcha-gimpy-renderers=رندرکننده‌های Gimpy کپچا ساده
simple-captcha-gimpy-renderers-help=نام کلاس‌هایی را وارد کنید که nl.captcha.gimpy.GimpyRenderer را پیاده‌سازی می‌کنند. این کلاس‌ها به طور تصادفی توسط Simple CAPTCHA برای تخریب تصویر کپچا استفاده می‌شوند.
simple-captcha-height=ارتفاع CAPTCHA ساده
simple-captcha-height-help=ارتفاع تصاویر کپچا تولید شده توسط Simple CAPTCHA را تنظیم کنید.
simple-captcha-noise-producers=تولیدکنندگان نویز کپچا ساده
simple-captcha-noise-producers-help=نام کلاس‌هایی را وارد کنید که nl.captcha.noise.NoiseProducer را پیاده‌سازی می‌کنند. این کلاس‌ها به طور تصادفی توسط Simple CAPTCHA برای افزودن نویز به تصویر کپچا استفاده می‌شوند.
simple-captcha-text-producers=تولیدکنندگان متن CAPTCHA ساده
simple-captcha-text-producers-help=نام کلاس‌هایی را وارد کنید که nl.captcha.text.producer.TextProducer را پیاده‌سازی می‌کنند. این کلاس‌ها به طور تصادفی توسط Simple CAPTCHA برای تولید متن برای تصویر کپچا استفاده می‌شوند.
simple-captcha-width=عرض CAPTCHA ساده
simple-captcha-width-help=عرض تصاویر کپچا تولید شده توسط Simple CAPTCHA را تنظیم کنید.
