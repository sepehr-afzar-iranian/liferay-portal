captcha-engine=موتور کپچا
captcha-engine-help=موتوری را که برای تولید کپچا استفاده می‌شود، تنظیم کنید. reCAPTCHA از یک سرویس خارجی استفاده می‌کند که باید به طور جداگانه پیکربندی شود، اما یک جایگزین شنیداری ارائه می‌دهد که کپچا را برای افراد کم‌بینا قابل دسترسی می‌کند. برای جزئیات بیشتر، به https://www.google.com/recaptcha/admin/create مراجعه کنید.
create-account-captcha-enabled=ایجاد حساب کاربری CAPTCHA فعال
max-challenges=حداکثر چالش ها
max-challenges-help=حداکثر تعداد بررسی کپچا در هر نشست پورتلت را تنظیم کنید. این مقدار را روی 0 تنظیم کنید تا همیشه بررسی شود. این مقدار را به عددی کمتر از 0 تنظیم کنید تا هرگز بررسی نشود. اگر بررسی کپچا فعال باشد، کاربران غیر احراز هویت شده همیشه در هر درخواست بررسی می شوند.
message-boards-edit-category-captcha-enabled=رده ویرایش CAPTCHA برای تالار گفتگو فعال شده است
message-boards-edit-message-captcha-enabled=پیام رسانی ویرایش CAPTCHA برای تالار گفتگو فعال شده است
recaptcha-no-script-url=reCAPTCHA بدون آدرس اسکریپت
recaptcha-private-key=reCAPTCHA کلید خصوصی
recaptcha-public-key=reCAPTCHA کلید عمومی
recaptcha-script-url=آدرس اسکریپت reCAPTCHA
recaptcha-verify-url=آدرس تایید reCAPTCHA
send-password-captcha-enabled=رمز عبور CAPTCHA را فعال کنید
simple-captcha-background-producers=ابزار ایجاد پس زمینه CAPTCHA ساده
simple-captcha-background-producers-help=نام کلاس‌هایی را وارد کنید که رابط nl.captcha.backgrounds.BackgroundProducer را پیاده‌سازی می‌کنند. این کلاس‌ها به‌طور تصادفی توسط کپچای ساده برای تولید پس‌زمینه برای یک تصویر کپچا استفاده می‌شوند.
simple-captcha-gimpy-renderers=رندرکننده‌های Gimpy کپچای ساده
simple-captcha-gimpy-renderers-help=نام کلاس‌هایی را وارد کنید که رابط nl.captcha.gimpy.GimpyRenderer را پیاده‌سازی می‌کنند. این کلاس‌ها به طور تصادفی توسط کپچای ساده برای معیوب کردن تصویر کپچا استفاده می‌شوند.
simple-captcha-height=ارتفاع کپچای ساده
simple-captcha-height-help=ارتفاع تصاویر کپچا تولید شده توسط کپچای ساده را تنظیم کنید.
simple-captcha-noise-producers=تولیدکنندگان نویز کپچای ساده
simple-captcha-noise-producers-help=نام کلاس‌هایی را وارد کنید که رابط nl.captcha.noise.NoiseProducer را پیاده‌سازی می‌کنند. این کلاس‌ها به طور تصادفی توسط کپچای ساده برای اضافه کردن نویز به یک تصویر کپچا استفاده می‌شوند.
simple-captcha-text-producers=تولیدکنندگان متن کپچای ساده
simple-captcha-text-producers-help=نام کلاس‌هایی را وارد کنید که رابط nl.captcha.text.producer.TextProducer را پیاده‌سازی می‌کنند. این کلاس‌ها به طور تصادفی توسط کپچای ساده برای تولید متن برای یک تصویر کپچا استفاده می‌شوند.
simple-captcha-width=عرض ساده CAPTCHA
simple-captcha-width-help=عرض تصاویر کپچا تولید شده توسط کپچای ساده را تنظیم کنید.
simple-captcha-word-renderers=رندرکننده‌های واژه کپچای ساده
simple-captcha-word-renderers-help=نام کلاس‌هایی را وارد کنید که رابط nl.captcha.text.renderer.WordRenderer را پیاده‌سازی می‌کنند. این کلاس‌ها به طور تصادفی توسط کپچای ساده برای رندر کردن متن برای یک تصویر کپچا استفاده می‌شوند.
