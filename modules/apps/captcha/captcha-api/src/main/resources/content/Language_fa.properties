simple-captcha-word-renderers-help=نام کلاس‌هایی را وارد کنید که nl.captcha.text.renderer.WordRenderer را پیاده‌سازی می‌کنند. این کلاس‌ها به طور تصادفی توسط Simple CAPTCHA برای رندر کردن متن برای تصویر کپچا استفاده می‌شوند.
