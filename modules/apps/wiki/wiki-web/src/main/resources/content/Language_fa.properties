import-wiki-images-help=یک فایل ZIP از تصاویر برای وارد کردن ارسال کنید. می‌توانید پوشه تصاویر MediaWiki را مستقیماً فشرده کنید (گاهی اوقات "upload" نامیده می‌شود). اگر این کار را انجام می‌دهید، توصیه می‌شود دایرکتوری‌های "archive"، "temp" و "thumbs" را برای کاهش اندازه ZIP حذف کنید زیرا نادیده گرفته می‌شوند.
import-wiki-pages-help=یک فایل XML صادر شده توسط MediaWiki از طریق صفحه "Special:Export" ارسال کنید (به "Special pages" در منوی جعبه ابزار مراجعه کنید).
import-wiki-strict-mode-help=تمام نشانه‌گذاری‌های غیرقابل تشخیص MediaWiki را از صفحه وارد شده حذف کنید.
import-wiki-users-help=یک فایل CSV با آدرس‌های ایمیل کاربران برای مطابقت با آدرس‌های موجود در پورتال ارسال کنید. این فایل باید دو ستون داشته باشد: نام کاربری و آدرس ایمیل. این فایل را می توان مستقیماً از پایگاه داده MediaWiki با استفاده از SQL به دست آورد.
javax.portlet.description.com_liferay_wiki_web_portlet_WikiAdminPortlet=ویکی یک دایره المعارف مشارکتی اجتماعی است که به کاربران اجازه می دهد گرد هم آیند و دانش خود را در یک زمینه به اشتراک بگذارند. مدیران می توانند صفحات ویکی را اضافه و ویرایش کنند، مجوزها را تغییر دهند و گزینه های پیشرفته را تنظیم کنند.
