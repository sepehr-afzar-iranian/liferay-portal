javax.portlet.description.com_liferay_my_account_web_portlet_MyAccountPortlet=تنظیمات حساب کاربری دسترسی به تنظیمات شخصی شما را در یک مکان آسان فراهم می کند. کاربران می توانند پروفایل خود را ویرایش کرده و عضویت های سایت و سازمان ها و گروه های کاربری را که به آنها تعلق دارند مشاهده کنند.
javax.portlet.description.com_liferay_users_admin_web_portlet_UsersAdminPortlet=کاربران افرادی هستند که با استفاده از پورتال وظایف را انجام می دهند. شما می توانید کاربران جدید ایجاد کنید یا کاربران موجود را غیرفعال کنید. کاربران می توانند به سایت ها ملحق شوند، در سلسله مراتب سازمانی قرار گیرند، در نقش ها مجوزها به آنها واگذار شود یا در گروه های کاربری جمع آوری شوند. گروه های کاربری می توانند از مرزهای سازمانی عبور کنند و می توانند برای اختصاص همه اعضا به مجموعه های دیگر مانند سایت ها یا نقش ها استفاده شوند. گروه های کاربری همچنین ممکن است برای سفارشی کردن الگوهای سایت شخصی برای اعضا استفاده شوند.
