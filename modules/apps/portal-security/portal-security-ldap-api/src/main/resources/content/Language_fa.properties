authentication-search-filter-help=فیلتر جستجویی را وارد کنید که برای تست اعتبار یک کاربر استفاده می شود. توکن‌های @company_id@، @email_address@، @screen_name@ و @user_id@ در زمان اجرا با مقادیر صحیح جایگزین می‌شوند.
autogenerate-user-password=تولید خودکار رمز عبور کاربر
base-dn-help=DN پایه، زمینه جستجوی اولیه را برای کاربران مشخص می کند و اختیاری است.
bind=متصل کردن
connection-properties=ویژگی های اتصال
contact-custom-mappings=نگاشت های سفارشی مخاطب
contact-custom-mappings-help=هنگام وارد کردن و صادر کردن کاربران، پورتال از این نگاشت برای اتصال ویژگی های کاربر LDAP و ویژگی های سفارشی مخاطب پورتال استفاده می کند.
contact-mappings=نگاشت های مخاطب
contact-mappings-help=هنگام وارد کردن و صادر کردن کاربران، پورتال از این نگاشت برای اتصال ویژگی های کاربر LDAP و ویژگی های مخاطب پورتال استفاده می کند.
create-role-per-group=ایجاد نقش برای هر گروه
enable-group-cache=فعال کردن حافظه پنهان گروه
enable-user-password=فعال کردن رمز عبور کاربر
error-password-age-keywords=کلیدواژه های خطای سن رمز عبور
error-password-expired-keywords=کلیدواژه های خطای انقضای رمز عبور
error-password-history-keywords=کلیدواژه های خطای تاریخچه رمز عبور
error-password-not-changeable-keywords=کلیدواژه های خطای غیرقابل تغییر بودن رمز عبور
error-password-syntax-keywords=کلیدواژه های خطای ساختار رمز عبور
error-password-trivial-text-keywords=کلیدواژه های خطای متن پیش پا افتاده رمز عبور
error-user-lockout-keywords=کلیدواژه های خطای قفل شدن کاربر
export-enabled=صادرات فعال شد
export-enabled-help=تنظیمات برای صادر کردن کاربران از پورتال به LDAP. این به کاربر اجازه می دهد تا نام، نام خانوادگی و غیره خود را در پورتال تغییر دهد و آن تغییر را به سرور LDAP منتقل کند. این تنظیمات استفاده نمی شوند مگر اینکه ویژگی "LDAPAuthConfiguration.enabled" روی true تنظیم شده باشد.
export-group-enabled=صادرات گروه فعال شد
export-group-enabled-help=اگر گروه‌ها و ارتباطات آنها باید از پورتال به LDAP صادر شوند، این گزینه را روی true تنظیم کنید. این تنظیمات استفاده نمی شوند مگر اینکه ویژگی "LDAPAuthConfiguration.enabled" روی true تنظیم شده باشد.
factory-initial=مقدار اولیه کارخانه
follow=دنبال کنید
group-default-object-classes-help=وقتی یک گروه به LDAP صادر می‌شود و گروه وجود ندارد، گروه با کلاس‌های شیء پیش‌فرض زیر ایجاد می‌شود.
group-mappings=نگاشت های گروه
group-mappings-help=هنگام وارد کردن گروه ها، پورتال از این نگاشت برای اتصال ویژگی های گروه LDAP و ویژگی های گروه کاربری پورتال استفاده می کند.
group-search-filter=فیلتر جستجوی گروه
group-search-filter-enabled=فیلتر جستجوی گروه فعال شد
group-search-filter-help=تنظیمات برای وارد کردن گروه ها از LDAP به پورتال. این تنظیمات استفاده نمی شوند مگر اینکه ویژگی "LDAPImportConfiguration.enabled" روی true تنظیم شده باشد.
groups-dn-help=گروه های جدید در DN مشخص شده ایجاد می شوند. این فقط در صورتی فعال می شود که ویژگی "LDAPAuthConfiguration.enabled" و "LDAPExportConfiguration.enabled" روی true تنظیم شده باشند.
import-create-role-per-group-help=اگر پورتال باید به طور خودکار برای هر گروه وارد شده از LDAP یک نقش ایجاد کند، این گزینه را روی true تنظیم کنید. این نقش به گروه اختصاص داده می شود تا کاربران بتوانند به طور خودکار هنگام اختصاص یافتن به گروه، آن نقش را به ارث ببرند.
import-group-cache-enabled-help=مشخص کنید که آیا جستجوهای DN گروه زمانی که LDAP وارد و وارد می شود، کش می شوند یا خیر. اگر روی true تنظیم شود، این امر باعث تسریع در وارد کردن و ورود به LDAP می شود، اما به روز رسانی های ویژگی های گروه تا زمانی که ورودی حافظه پنهان منقضی نشود، شناسایی نمی شوند. اندازه حافظه پنهان و مهلت زمانی را می توان برای حافظه پنهان با استفاده از نام حافظه پنهان "com.liferay.portal.security.exportimport.UserImporter" پیکربندی کرد.
import-lock-expiration-time-help=زمان انقضای قفل را برای وارد کردن LDAP تنظیم کنید. به طور پیش فرض، زمان انقضا 1 روز است.
import-method=روش وارد کردن
import-method-help=روش وارد کردن را روی کاربر یا گروه تنظیم کنید. اگر روی کاربر تنظیم شود، پورتال همه کاربران و گروه های مرتبط با آن کاربران را وارد می کند. اگر روی گروه تنظیم شود، پورتال همه گروه ها و کاربران مرتبط با آن گروه ها را وارد می کند. این مقدار باید بر اساس نحوه ذخیره اطلاعات عضویت گروه توسط سرور LDAP شما تنظیم شود.
import-user-sync-strategy=استراتژی همگام سازی کاربر وارد شده
ldap-auth-configuration-name=احراز هویت
ldap-export-configuration-name=صادرات
ldap-import-configuration-name=وارد کردن
ldap-server-configuration-name=سرورها
lock-expiration-time=زمان انقضای قفل
method-help=برای روش احراز هویت LDAP، bind یا password-compare را تنظیم کنید. Bind توسط اکثر فروشندگان ترجیح داده می شود، بنابراین لازم نیست نگران استراتژی های رمزگذاری باشید.
page-size=اندازه صفحه
page-size-help=اندازه صفحه را برای سرورهای دایرکتوری که از صفحه بندی پشتیبانی می کنند تنظیم کنید. این مقدار باید برای سرور Microsoft Active Directory 1000 یا کمتر باشد.
password-compare=مقایسه رمز عبور
password-encryption-algorithm-help=رمزگذاری رمز عبور را برای استفاده در مقایسه رمزهای عبور در هنگام وارد کردن و استفاده برای رمزگذاری رمزهای عبور در هنگام صادر کردن تنظیم کنید. مقایسه رمزهای عبور در هنگام وارد کردن فقط زمانی استفاده می شود که ویژگی "LDAPAuthConfiguration.method" روی password-compare تنظیم شده باشد. اگر رمزگذاری روی NONE تنظیم شده باشد که مقدار پیش فرض است، رمزهای عبور به صورت متن ساده در نظر گرفته می شوند. الگوریتم SHA-512 در حال حاضر پشتیبانی نمی شود.
password-policy-enabled=سیاست رمز عبور فعال شد
password-policy-enabled-help=این را روی true تنظیم کنید تا از سیاست رمز عبور LDAP به جای سیاست رمز عبور پورتال استفاده کنید. اگر روی true تنظیم شود، این احتمال وجود دارد که رمزهای عبور تولید شده توسط پورتال با سیاست LDAP مطابقت نداشته باشند. برای جزئیات بیشتر در مورد پیکربندی RegExpToolkit در تولید این رمزهای عبور، به ویژگی های "passwords.regexptoolkit.*" مراجعه کنید. توجه داشته باشید که اگر این فعال باشد، پورتال رمزهای عبور معتبر، رمزهای عبور منقضی شده یا کاربرانی را که قفل شده اند بررسی نمی کند. این کار اکنون توسط خط مشی رمز عبور سرور LDAP انجام می شود.
range-size=اندازه محدوده
range-size-help=تعداد مقادیری را که باید در هر پرس و جو به یک ویژگی چند مقداری برای سرورهای دایرکتوری که از بازیابی محدوده پشتیبانی می کنند، برگردانده شود، تنظیم کنید. اندازه محدوده باید برای ویندوز 2000، 1000 یا کمتر و برای ویندوز سرور 2003، 1500 یا کمتر باشد.
referral=ارجاع
security-credential=اعتبار امنیتی
security-principal=اصول امنیتی
system-ldap-configuration-name=اتصال
throws=پرتاب می کند
user-custom-mappings=نگاشت های سفارشی کاربر
user-custom-mappings-help=هنگام وارد کردن و صادر کردن کاربران، پورتال از این نگاشت برای اتصال ویژگی های کاربر LDAP و ویژگی های سفارشی کاربر پورتال استفاده می کند.
user-default-object-classes-help=هنگامی که یک کاربر به LDAP صادر می شود و کاربر وجود ندارد، کاربر با کلاس های شیء پیش فرض زیر ایجاد می شود.
user-ignore-attributes=نادیده گرفتن ویژگی های کاربر
user-ignore-attributes-help=ویژگی‌های کاربری را که از پورتال کنترل می‌شوند، تنظیم کنید. هنگام افزودن یا به‌روزرسانی کاربر از LDAP، این ویژگی‌ها نادیده گرفته می‌شوند.
user-mappings=نگاشت های کاربر
user-mappings-help=هنگام وارد کردن و صادر کردن کاربران، پورتال از این نگاشت برای اتصال ویژگی های کاربر LDAP و ویژگی های کاربر پورتال استفاده می کند.
user-search-filter=فیلتر جستجوی کاربر
user-search-filter-help=تنظیمات برای وارد کردن کاربران از LDAP به پورتال. این تنظیمات استفاده نمی شوند مگر اینکه ویژگی "LDAPImportConfiguration.enabled" روی true تنظیم شده باشد.
users-dn-help=کاربران جدید در DN مشخص شده ایجاد می شوند. این فقط در صورتی فعال می شود که ویژگی "LDAPAuthConfiguration.enabled" و "LDAPExportConfiguration.enabled" روی true تنظیم شده باشند.
