buffered=بافرشده
buffered-execution-mode=حالت اجرای بافرشده
default-keyword-query-configuration-name=پرس و جوی کلمه کلیدی پیش فرض
default-search-result-permission-filter-configuration-name=پیکربندی پیش فرض فیلتر مجوز نتیجه جستجو
disabled-entry-class-names=نام کلاس های ورودی غیرفعال شده
disabled-entry-class-names-help=نام کلاس های ورودی را مشخص کنید که برای آن ها DefaultKeywordQueryContributor فیلدهای description، userName و title را به عنوان بخشی از پرس و جوی جستجوی کلمه کلیدی در نظر نمی گیرد.
exact-match-boost=افزایش مطابقت دقیق
exact-match-boost-help=مقدار تقویتی را تعیین کنید که هنگام مطابقت عبارات جستجو با عنوان به عنوان یک عبارت دقیق، اعمال می شود.
excluded-entry-class-names=نام کلاس های ورودی مستثنی شده
field-name-patterns=الگوهای نام فیلد
include-inherited-permissions=شامل مجوزهای ارثی شود
include-inherited-permissions-help=برای گنجاندن نقش های ارثی کاربر به عنوان بخشی از فیلتر مجوز جستجو، این گزینه را روی درست تنظیم کنید. نقش های ارثی کاربر شامل تمام کاربران اختصاص داده شده به یک کاربر از طریق گروه کاربری و عضویت های سازمانی آن ها می شود.
index-commit-immediately=تایید فوری فهرست
index-commit-immediately-help=برای تایید فوری درخواست های نوشتن فهرست جستجو، این گزینه را روی درست تنظیم کنید. تنظیم این گزینه روی درست ممکن است بر عملکرد موتور جستجو تأثیر منفی بگذارد، زیرا هر درخواست نوشتن موتور جستجو را مجبور می کند تا خواننده فهرست را تازه کند و به طور بالقوه تراکنش ها را روی دیسک تخلیه کند. رفتار پیش فرض پورتال این است که فوراً برای عملیات فهرست فردی (به عنوان مثال، افزودن وبلاگ، به روز رسانی وبلاگ) متعهد شود، اما تعهدات را برای عملیات انبوه (به عنوان مثال، فهرست کردن همه کاربران، فهرست کردن همه ویکی ها) تا زمانی که همه ورودی ها به موتور جستجو ارسال شوند، به تأخیر می اندازد. تنظیم این گزینه روی نادرست ممکن است باعث شود ویجت‌هایی مانند Asset Publisher هنگام نشان دادن محتوای تازه اضافه شده، پاسخ با تاخیر نشان دهند. به عنوان مثال، کاربران ممکن است با موتور جستجوی پیش فرض Elasticsearch تاخیر را تجربه کنند. برای اطلاعات بیشتر، به https://www.elastic.co/guide/en/elasticsearch/guide/current/near-real-time.html مراجعه کنید.
index-status-manager-configuration-name=مدیریت وضعیت فهرست
index-writer-helper-configuration-name=دستیار نویسنده فهرست
indexer-registry-configuration-name=ثبت فهرست
indexing-batch-sizes=اندازه دسته ای فهرست بندی
indexing-batch-sizes-help=تعداد اسنادی که در هر دسته برای انواع مدل هایی که از فهرست بندی دسته ای پشتیبانی می کنند، فهرست می شوند. مقدار پیش فرض 10000 است. برای مدل هایی با اسناد بزرگ، کاهش این مقدار ممکن است هنگام اجرای فهرست بندی مجدد کامل، پایداری را بهبود بخشد.
max-buffer-size=حداکثر اندازه بافر
max-expansions=حداکثر گسترش ها
max-expansions-help=تعداد عناوین منحصر به فردی را که می توانند هنگام مطابقت عبارات جستجو با عنوان به عنوان پیشوند عبارت مطابقت داده شوند، تنظیم کنید.
minimum-buffer-availability-percentage=حداقل درصد دسترسی بافر
nonbulk-indexing-override=نادیده گرفتن فهرست بندی غیر انبوه
nonbulk-indexing-override-help=مقدار "true" باعث می شود موجودیت های اصلاح شده همیشه یک به یک دوباره فهرست شوند. به دلایل عملکردی، این تنظیم معمولاً در محیط تولید خاموش است.
permission-filtered-search-result-accurate-count-threshold=آستانه شمارش دقیق نتیجه جستجوی فیلتر شده با مجوز
permission-filtered-search-result-accurate-count-threshold-help=اگر یک پرس و جوی جستجو نتایج جستجو را با شمارشی برگرداند که در این آستانه باشد، شمارش کل پس از فیلتر کردن مجوز، تضمین می شود که دقیق باشد.
permission-terms-limit=محدودیت شرایط مجوز
permission-terms-limit-help=این را تنظیم کنید تا تعداد عبارات جستجوی مجوز که به پرس و جوی جستجو اضافه می شوند را محدود کنید. اگر از این محدودیت فراتر رود، هیچ عبارت جستجوی مجوز اضافه نمی شود. در عوض، بررسی مجوز به فیلتر مجوز جستجو باز می گردد.
query-pre-process-configuration-name=پیش پردازنده پرس و جوی فهرست
reindex-configuration-name=فهرست بندی مجدد
reindexer-configuration-name=فهرست ساز مجدد
search-engine-helper-configuration-name=دستیار موتور
search-permission-checker-configuration-name=بررسی کننده مجوز
search-query-result-window-limit=محدودیت پنجره نتیجه پرس و جوی جستجو
search-query-result-window-limit-help=این را تنظیم کنید تا تعداد نتایج جستجویی را که می توان از یک پرس و جوی جستجو درخواست کرد، محدود کنید.
synchronous-execution-override=نادیده گرفتن اجرای همزمان
synchronous-execution-override-help=مقدار "true" باعث می شود فهرست بندی مجدد موجودیت های اصلاح شده همیشه تا زمان تکمیل شدن مسدود شود. به دلایل عملکردی، این تنظیم معمولاً در محیط تولید خاموش است.
title-field-query-builder-configuration-name=پیکربندی سازنده پرس و جوی فیلد عنوان
