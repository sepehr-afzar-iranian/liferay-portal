enabled-help=برای فعال کردن ورود یکپارچه NTLM، این گزینه را روی true تنظیم کنید. NTLM تنها در صورتی کار می‌کند که احراز هویت LDAP نیز فعال باشد و احراز هویت از طریق نام صفحه انجام شود.
