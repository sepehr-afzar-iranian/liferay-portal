xuggler-has-been-installed-you-need-to-reboot-your-server-to-apply-changes=Xuggler نصب شده است. برای اعمال تغییرات باید سرور خود را دوباره راه اندازی کنید.
xuggler-help=Xuggler نیاز به نصب کتابخانه‌های بومی دارد که تحت مجوز GPL توزیع می‌شوند. اگر می‌توانید محیط خود را در زیر مشخص کنید، سرور می‌تواند به طور خودکار کتابخانه‌ها را برای شما دانلود و نصب کند. متعاقباً از شما خواسته می‌شود که سرور را مجدداً راه اندازی کنید. اگر محیط شما در زیر ذکر نشده است، باید کتابخانه‌ها را به صورت دستی کامپایل و نصب کنید. <a href="{0}" target="_blank">بیشتر بخوانید.</a>
xuggler-installed=به نظر می‌رسد Xuggler به درستی نصب شده است. فعال کنید تا امکان تولید پیش نمایش صوتی و تصویری فراهم شود.
xuggler-library-is-installing=کتابخانه Xuggler در حال نصب است.