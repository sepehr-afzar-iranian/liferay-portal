clean-up-permissions-help=این فرایند انتساب برخی مجوزها را در نقش‌های مهمان، کاربر و کاربر قدرتمند حذف می‌کند تا مدیریت <em>صفحات قابل تنظیم توسط کاربر</em> ساده‌تر شود. به ویژه، مجوزهای <em>افزودن به صفحه</em> از نقش‌های مهمان و کاربر برای همه برنامه‌ها حذف می‌شود. به طور مشابه، دامنه مجوز مشابه برای کاربران قدرتمند از کل پورتال به دامنه <em>سایت شخصی کاربر</em> کاهش می‌یابد.
