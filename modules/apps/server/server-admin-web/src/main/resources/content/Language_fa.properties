clean-up-orphaned-page-revision-portlet-preferences-help=این فرایند همه تنظیمات پورتلت یتیم‌شده متعلق به بازبینی صفحه‌ها را حذف می‌کند. تنظیمات پورتلت متعلق به پورتلتی که به بازبینی صفحه تعلق ندارد حذف خواهد شد. تنظیمات پورتلت متعلق به پورتلت‌های زمان اجرا نیز حذف خواهد شد.
