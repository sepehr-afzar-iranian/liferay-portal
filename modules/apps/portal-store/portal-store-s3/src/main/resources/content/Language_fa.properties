access-key=کلید دسترسی
access-key-help=کلید دسترسی حساب AWS را تنظیم کنید.
bucket-name=نام صندوق
bucket-name-help=نام سطلی که توسط S3 برای ذخیره فایل‌ها استفاده می‌شود را تنظیم کنید.
cache-dir-clean-up-expunge=پاکسازی دایرکتوری کش
cache-dir-clean-up-expunge-help=تعداد روزهایی که یک فایل در حافظه پنهان نگهداری می‌شود را تنظیم کنید.
cache-dir-clean-up-frequency=تناوب پاکسازی دایرکتوری کش
cache-dir-clean-up-frequency-help=نسبت بین تعداد فراخوانی‌های متد پاکسازی حافظه پنهان فایل و پاکسازی واقعی حافظه پنهان فایل را تنظیم کنید. این ویژگی را روی 1 تنظیم کنید تا همیشه پاکسازی انجام شود. اعداد بالاتر، تناوب را کاهش می‌دهند.
connection-protocol=پروتکل اتصال
connection-protocol-help=پروتکل مورد استفاده برای اتصال به S3 (HTTP یا HTTPS) را تنظیم کنید.
connection-timeout=وقفه اتصال
connection-timeout-help=مدت زمانی که باید منتظر بمانید (بر حسب میلی‌ثانیه) هنگام برقراری اتصال اولیه قبل از اتمام زمان، تنظیم کنید. مقدار 0 به معنی بی‌نهایت است و توصیه نمی‌شود.
core-pool-size=اندازه صندوق اصلی
core-pool-size-help=تعداد اولیه رشته‌های مورد استفاده برای بارگذاری قسمت‌ها را تنظیم کنید.
http-client-max-connections=حداکثر اتصالات HTTP
http-client-max-connections-help=حداکثر تعداد اتصالات HTTP باز مجاز را تنظیم کنید.
http-client-max-error-retry=حداکثر تلاش مجدد HTTP
http-client-max-error-retry-help=حداکثر تعداد تلاش مجدد برای درخواست‌های قابل تکرار ناموفق را تنظیم کنید.
max-pool-size=حداکثر اندازه‌ی صندوق
max-pool-size-help=حداکثر تعداد رشته‌هایی که هنگام بارگذاری قسمت‌ها استفاده می‌شود را تنظیم کنید.
minimum-uploads-part-size=حداقل اندازه قسمت
minimum-uploads-part-size-help=حداقل اندازه قسمت برای قسمت‌های آپلود را تنظیم کنید. کاهش حداقل اندازه قسمت باعث می‌شود آپلودهای چند قسمتی به تعداد بیشتری قسمت کوچکتر تقسیم شوند. تنظیم این مقدار خیلی کم، تأثیر منفی بر سرعت انتقال دارد و باعث تأخیر اضافی و ارتباطات شبکه برای هر قسمت می‌شود.
multipart-upload-threshold=آستانه آپلود چند قسمتی
multipart-upload-threshold-help=آستانه اندازه (بر حسب بایت) هنگام استفاده از آپلودهای چند قسمتی را تنظیم کنید. آپلودهای بالاتر از این اندازه به طور خودکار از یک استراتژی آپلود چند قسمتی استفاده می‌کنند، در حالی که آپلودهای کوچکتر از این آستانه از یک اتصال واحد برای بارگذاری کل شی استفاده می‌کنند.
ntlm-proxy-domain=دامنه پراکسی NTLM
ntlm-proxy-domain-help=نام دامنه ویندوز را برای یک پراکسی NTLM تنظیم کنید. اگر از یک پراکسی Windows NTLM استفاده نمی‌کنید، این ویژگی را تنظیم نکنید.
ntlm-proxy-workstation=ایستگاه کاری پراکسی NTLM
ntlm-proxy-workstation-help=نام ایستگاه کاری ویندوز را برای یک پراکسی NTLM تنظیم کنید. اگر از یک پراکسی Windows NTLM استفاده نمی‌کنید، این ویژگی را تنظیم نکنید.
proxy-auth-type=نوع احراز هویت پراکسی
proxy-auth-type-help=نوع احراز هویت پراکسی را برای استفاده هنگام اتصال به سرویس S3 تنظیم کنید. "None" هیچ پروکسی را پیکربندی نمی‌کند. "Username-password" یک پروکسی را پیکربندی می‌کند. برای این پیکربندی، مقادیری را برای نام کاربری پروکسی و رمز عبور پروکسی مشخص کنید. "Ntlm" یک پروکسی Windows NTLM را پیکربندی می‌کند. برای این پیکربندی، مقادیری را برای نام کاربری پروکسی، رمز عبور پروکسی، دامنه پروکسی NTLM و ایستگاه کاری پروکسی NTLM مشخص کنید.
proxy-host-help=هاست پروکسی را که مشتری برای اتصال استفاده می‌کند، تنظیم کنید.
proxy-password=رمز پروکسی
proxy-password-help=رمز عبور پروکسی را برای استفاده در صورت اتصال از طریق یک پروکسی تنظیم کنید.
proxy-port-help=پورت پروکسی را که مشتری برای اتصال استفاده می‌کند، تنظیم کنید.
proxy-username=نام کاربری پروکسی
proxy-username-help=نام کاربری پروکسی را برای استفاده در صورت اتصال از طریق یک پروکسی تنظیم کنید.
s3-endpoint=نقطه پایانی S3
s3-endpoint-help=نقطه پایانی پیش فرض برای اتصال به S3 را تنظیم کنید.
s3-pathstyle=استفاده از سبک مسیر
s3-pathstyle-help=از دسترسی به سبک مسیر برای همه درخواست‌ها استفاده کنید.
s3-region=منطقه S3
s3-region-help=منطقه آمازون S3 را تنظیم کنید، که نشان دهنده یک منطقه جغرافیایی است که در آن آمازون S3 سطلهای ایجاد شده توسط کاربر را ذخیره می‌کند. مناطق آمازون S3 برای بهینه‌سازی تأخیر، به حداقل رساندن هزینه‌ها و برآوردن الزامات نظارتی استفاده می‌شوند. اشیاء ذخیره شده در یک منطقه آمازون S3 هرگز از آن منطقه خارج نمی‌شوند مگر اینکه به صراحت به منطقه دیگری منتقل شوند.
s3-storage-class=کلاس ذخیره سازی S3
s3-storage-class-help=کلاس ذخیره سازی Amazon S3 را تنظیم کنید. کلاس ذخیره سازی STANDARD به طور پیش فرض استفاده می‌شود و به این معنی است که نسخه‌های اضافی از داده‌ها در مکان‌های مختلف ذخیره می‌شوند. کلاس ذخیره سازی REDUCED_REDUNDANCY برای ذخیره داده‌های غیر حیاتی و قابل تکثیر در نظر گرفته شده است و یک گزینه ذخیره سازی کم هزینه و بسیار در دسترس ارائه می‌دهد. با این حال، این گزینه افزونگی کمتری دارد.
s3-store-configuration-name=فروشگاه S3
secret-key=کلید مخفی
secret-key-help=کلید مخفی حساب AWS را تنظیم کنید.
signer-override=نادیده گرفتن امضاکننده
signer-override-help=نام الگوریتم امضا را برای استفاده در امضای درخواست‌ها تنظیم کنید.
