access-key=کلید دسترسی
access-key-help=کلید دسترسی حساب AWS را تنظیم کنید.
bucket-name=نام سطل
bucket-name-help=نام سطل مورد استفاده توسط S3 برای ذخیره فایل ها را تنظیم کنید.
cache-dir-clean-up-expunge=پاکسازی و حذف دایرکتوری کش
cache-dir-clean-up-expunge-help=تعداد روزهایی که یک فایل در حافظه کش نگه داشته می شود را تنظیم کنید.
cache-dir-clean-up-frequency=تناوب پاکسازی دایرکتوری کش
cache-dir-clean-up-frequency-help=نسبت بین تعداد فراخوانی‌های متد پاکسازی کش فایل و پاکسازی واقعی کش فایل را تنظیم کنید. برای پاکسازی همیشگی، این ویژگی را روی 1 تنظیم کنید. اعداد بالاتر تناوب را کاهش می‌دهند.
connection-protocol=پروتکل اتصال
connection-protocol-help=پروتکل مورد استفاده برای اتصال به S3 (HTTP یا HTTPS) را تنظیم کنید.
connection-timeout=وقفه اتصال
connection-timeout-help=مدت زمانی را که باید منتظر ماند (بر حسب میلی ثانیه) هنگام ایجاد اولیه یک اتصال قبل از اتمام وقت را تنظیم کنید. مقدار 0 به معنای بی نهایت است و توصیه نمی شود.
core-pool-size=اندازه هسته استخر
core-pool-size-help=تعداد اولیه رشته های مورد استفاده برای بارگذاری بخش ها را تنظیم کنید.
http-client-max-connections=حداکثر اتصالات HTTP
http-client-max-connections-help=حداکثر تعداد اتصالات HTTP باز مجاز را تنظیم کنید.
http-client-max-error-retry=حداکثر تعداد تلاش مجدد HTTP
http-client-max-error-retry-help=حداکثر تعداد تلاش مجدد برای درخواست های قابل تکرار ناموفق را تنظیم کنید.
max-pool-size=حداکثر اندازه استخر
max-pool-size-help=حداکثر تعداد رشته های مورد استفاده هنگام بارگذاری قسمت ها را تنظیم کنید.
minimum-uploads-part-size=حداقل اندازه بخش
minimum-uploads-part-size-help=حداقل اندازه قسمت برای قسمت‌های بارگذاری را تنظیم کنید. کاهش حداقل اندازه قسمت باعث می‌شود که بارگذاری‌های چند قسمتی به تعداد بیشتری از قسمت‌های کوچک‌تر تقسیم شوند. تنظیم این مقدار خیلی کم، تأثیر منفی بر سرعت انتقال دارد و باعث تأخیر اضافی و ارتباط شبکه برای هر قسمت می‌شود.
multipart-upload-threshold=آستانه بارگذاری چند قسمتی
multipart-upload-threshold-help=آستانه اندازه (بر حسب بایت) هنگام استفاده از بارگذاری های چند قسمتی را تنظیم کنید. آپلودهای بالاتر از این اندازه به طور خودکار از استراتژی بارگذاری چند قسمتی استفاده می کنند، در حالی که آپلودهای کوچکتر از این آستانه از یک اتصال واحد برای بارگذاری کل شی استفاده می کنند.
ntlm-proxy-domain=دامنه پراکسی NTLM
ntlm-proxy-domain-help=نام دامنه ویندوز را برای یک پروکسی NTLM تنظیم کنید. اگر از یک پروکسی NTLM ویندوز استفاده نمی کنید، این ویژگی را تنظیم نکنید.
ntlm-proxy-workstation=ایستگاه کاری پراکسی NTLM
ntlm-proxy-workstation-help=نام ایستگاه کاری ویندوز را برای یک پروکسی NTLM تنظیم کنید. اگر از یک پروکسی NTLM ویندوز استفاده نمی کنید، این ویژگی را تنظیم نکنید.
proxy-auth-type=نوع احراز هویت پراکسی
proxy-auth-type-help=نوع احراز هویت پراکسی را برای استفاده هنگام اتصال به سرویس S3 تنظیم کنید. "None" هیچ پروکسی را پیکربندی نمی کند. "Username-password" یک پروکسی را پیکربندی می کند؛ برای این پیکربندی، مقادیری را برای نام کاربری پروکسی و رمز عبور پروکسی مشخص کنید. "Ntlm" یک پروکسی Windows NTLM را پیکربندی می کند؛ برای این پیکربندی، مقادیری را برای نام کاربری پروکسی، رمز عبور پروکسی، دامنه پروکسی NTLM و ایستگاه کاری پروکسی NTLM مشخص کنید.
proxy-host-help=هاست پروکسی که مشتری برای اتصال استفاده می کند را تنظیم کنید.
proxy-password=رمز عبور پروکسی
proxy-password-help=رمز عبور پروکسی را برای استفاده در صورت اتصال از طریق یک پروکسی تنظیم کنید.
proxy-port-help=پورت پروکسی که مشتری برای اتصال استفاده می کند را تنظیم کنید.
proxy-username=نام کاربری پروکسی
proxy-username-help=نام کاربری پروکسی را برای استفاده در صورت اتصال از طریق یک پروکسی تنظیم کنید.
s3-endpoint=نقطه پایانی S3
s3-endpoint-help=نقطه پایانی پیش فرض را برای استفاده برای اتصال به S3 تنظیم کنید.
s3-pathstyle=استفاده از سبک مسیر
s3-pathstyle-help=برای همه درخواست ها از دسترسی سبک مسیر استفاده کنید.
s3-region=منطقه S3
s3-region-help=منطقه Amazon S3 را تنظیم کنید، که نشان دهنده یک منطقه جغرافیایی است که Amazon S3 سطل های ایجاد شده توسط کاربر را در آن ذخیره می کند. مناطق Amazon S3 برای بهینه سازی تاخیر، به حداقل رساندن هزینه ها و رسیدگی به الزامات نظارتی استفاده می شوند. اشیاء ذخیره شده در یک منطقه Amazon S3 هرگز آن منطقه را ترک نمی کنند مگر اینکه صریحاً به منطقه دیگری منتقل شوند.
s3-storage-class=کلاس ذخیره سازی S3
s3-storage-class-help=کلاس ذخیره سازی Amazon S3 را تنظیم کنید. کلاس ذخیره سازی STANDARD به طور پیش فرض استفاده می شود و به این معنی است که نسخه های اضافی از داده ها در مکان های مختلف ذخیره می شوند. کلاس ذخیره سازی REDUCED_REDUNDANCY برای ذخیره داده های غیر بحرانی و قابل تکثیر در نظر گرفته شده است و یک گزینه ذخیره سازی کم هزینه و بسیار در دسترس را ارائه می دهد؛ با این حال، این گزینه کمتر افزونه است.
s3-store-configuration-name=فروشگاه S3
secret-key=کلید مخفی
secret-key-help=کلید مخفی حساب AWS را تنظیم کنید.
signer-override=نادیده گرفتن امضاکننده
signer-override-help=نام الگوریتم امضا را برای استفاده برای امضای درخواست ها تنظیم کنید.