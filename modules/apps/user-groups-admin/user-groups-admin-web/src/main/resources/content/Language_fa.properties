javax.portlet.description.com_liferay_user_groups_admin_web_portlet_UserGroupsAdminPortlet=گروه‌های کاربری روشی برای گروه‌بندی کاربران مستقل از سازمان‌هایی که به آن‌ها تعلق دارند، فراهم می‌کنند. می‌توانید یک گروه کاربری تعریف کنید و گروه کاربری را به عنوان عضوی از یک سایت اختصاص دهید تا همه کاربران آن به طور خودکار عضو شوند.
