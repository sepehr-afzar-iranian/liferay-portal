the-pages-of-a-user-group-cannot-be-accessed-directly-by-end-users=صفحات یک گروه کاربری را نمی‌توان مستقیماً توسط کاربران نهایی باز کرد. بلکه هر عضو گروه کاربری به طور خودکار صفحات را به عنوان بخشی از صفحات داشبورد شخصی و نمایه خود مشاهده می‌کند. برای اینکه کاربران بتوانند تغییراتی ایجاد کنند، گزینه‌های سفارشی‌سازی هر صفحه را فعال کنید.
