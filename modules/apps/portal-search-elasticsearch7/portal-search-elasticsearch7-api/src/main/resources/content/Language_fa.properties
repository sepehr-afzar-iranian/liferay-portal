active-help=فعال یا غیرفعال کردن این اتصال.
additional-configurations=پیکربندی‌های اضافی
additional-configurations-help=این پیکربندی فقط در حالت EMBEDDED (توسعه) اعمال می‌شود. تنظیمات سفارشی را برای گره Elasticsearch sidecar، در قالب YML (elasticsearch.yml) تنظیم کنید.
additional-index-configurations=پیکربندی‌های اضافی ایندکس
additional-index-configurations-help=تنظیمات سفارشی را برای ایندکس Liferay، در قالب JSON (Elasticsearch Create Index API) یا YML تنظیم کنید.
additional-type-mappings=نگاشت‌های نوع اضافی
additional-type-mappings-help=نگاشت‌های سفارشی را برای LiferayDocumentType، در قالب JSON (Elasticsearch Put Mapping API) تنظیم کنید. این مقدار باید فقط با نگاشت‌های فیلد جدید تنظیم شود. اگر این مقدار را با هر نگاشت همپوشانی برای فیلدهای پیش‌فرض تنظیم کنید، ایجاد ایندکس با خطا مواجه می‌شود. برای جایگزینی کامل نگاشت‌های پیش‌فرض، از Override Type Mappings استفاده کنید.
authentication-enabled=احراز هویت فعال شد
authentication-enabled-help=فعال یا غیرفعال کردن احراز هویت به Elasticsearch با نام کاربری و رمز عبور.
bootstrap-mlockall=Bootstrap Mlockall
bootstrap-mlockall-help=این پیکربندی فقط در حالت EMBEDDED (توسعه) اعمال می‌شود. اگر این گزینه علامت زده شود، فضای آدرس فرآیند در RAM قفل می‌شود و از تعویض حافظه Elasticsearch جلوگیری می‌کند.
cluster-name=نام خوشه
cluster-name-help=این پیکربندی فقط در حالت EMBEDDED (توسعه) اعمال می‌شود. نام خوشه‌ای را که باید به آن بپیوندید را تعیین کنید.
connection-id=شناسه اتصال
connection-id-help=یک شناسه یکتا برای این اتصال تنظیم کنید.
discovery-zen-ping-unicast-hosts-port=درگاه هاست های یکپارچه Zen Discovery
discovery-zen-ping-unicast-hosts-port-help=این پیکربندی منسوخ شده است. این پیکربندی فقط در حالت EMBEDDED (توسعه) اعمال می‌شود. محدوده ای از پورت ها را برای استفاده در هنگام ساخت مقدار discovery.zen.ping.unicast.hosts ارائه دهید. چندین گره Elasticsearch در محدوده ای از پورت ها می توانند به عنوان روترهای شایعه در همان رایانه عمل کنند.
elasticsearch-connection-configuration-name=اتصالات Elasticsearch
elasticsearch7-configuration-name=Elasticsearch 7
embedded-http-port=درگاه HTTP داخلی
embedded-http-port-help=این پیکربندی منسوخ شده است. این پیکربندی فقط در حالت EMBEDDED (توسعه) اعمال می‌شود. پورت HTTP گره Elasticsearch sidecar را که هنگام غیرفعال شدن حالت Production و تنظیم Operation Mode روی EMBEDDED ایجاد می‌شود، تنظیم کنید.
http-cors-allow-origin=منشاء مجاز HTTP CORS
http-cors-allow-origin-help=این پیکربندی فقط در حالت EMBEDDED (توسعه) اعمال می‌شود. مبداهایی را که هنگام فعال بودن HTTP CORS مجاز هستند، تعیین کنید.
http-cors-configurations=پیکربندی‌های HTTP CORS
http-cors-configurations-help=این پیکربندی فقط در حالت EMBEDDED (توسعه) اعمال می‌شود. تنظیمات سفارشی را برای HTTP CORS، در قالب YML (elasticsearch.yml) ارائه دهید.
http-cors-enabled=HTTP CORS فعال شد
http-cors-enabled-help=این پیکربندی فقط در حالت EMBEDDED (توسعه) اعمال می‌شود. اگر این گزینه علامت زده شود، اشتراک‌گذاری منابع متقاطع مبدا فعال می‌شود، که تعیین می‌کند آیا یک مرورگر در مبدا دیگری می‌تواند درخواست‌هایی را به Elasticsearch ارسال کند یا خیر. اگر غیرفعال باشد، ابزارهای front-end وب مانند elasticsearch-head ممکن است نتوانند متصل شوند.
http-ssl-enabled=HTTP SSL فعال شد
http-ssl-enabled-help=فعال یا غیرفعال کردن TLS/SSL.
index-name-prefix=پیشوند نام ایندکس
index-name-prefix-help=پیشوند نام ایندکس جستجو را تنظیم کنید. این مقدار نباید در شرایط عادی تغییر کند. اگر این مقدار را تغییر دهید، باید پورتال را نیز دوباره ایندکس کنید و سپس به صورت دستی ایندکس قدیمی را با استفاده از کنسول مدیریت Elasticsearch حذف کنید.
log-exceptions-only=فقط ثبت استثناها
log-exceptions-only-help=اگر این گزینه علامت زده شود، استثنائات Elasticsearch بدون بازگرداندن مجدد، گرفته و ثبت می‌شوند.
network-bind-host=هاست اتصال شبکه
network-bind-host-help=این پیکربندی فقط در حالت EMBEDDED (توسعه) اعمال می‌شود. رابط (های) شبکه ای را که یک گره باید به آن متصل شود تا به درخواست های ورودی گوش دهد ، مشخص کنید.
network-host=هاست شبکه
network-host-addresses=آدرس های هاست شبکه
network-host-addresses-help=هاست‌های HTTP راه دور را برای اتصال تنظیم کنید.
network-host-help=این پیکربندی فقط در حالت EMBEDDED (توسعه) اعمال می‌شود. نام میزبان یا آدرس IP متصل به گره را تنظیم کنید، که برای انتشار (تبلیغ) میزبان به سایر گره‌های خوشه استفاده می‌شود. این میانبری است که به طور همزمان میزبان اتصال و میزبان انتشار را تنظیم می کند.
network-publish-host=هاست انتشار شبکه
network-publish-host-help=این پیکربندی فقط در حالت EMBEDDED (توسعه) اعمال می‌شود. یک رابط واحد را که گره به سایر گره‌های موجود در خوشه تبلیغ می کند، تنظیم کنید، به طوری که آن گره ها بتوانند به آن متصل شوند.
node-name=نام گره
node-name-help=این پیکربندی فقط در حالت EMBEDDED (توسعه) اعمال می‌شود. نام گره را برای شروع تنظیم کنید. در صورت عدم تنظیم، "liferay" استفاده می‌شود.
number-of-index-replicas=تعداد رونوشت های ایندکس شرکت و سیستم
number-of-index-replicas-help=تعداد رونوشت ها را برای هر ایندکس شرکت و سیستم Liferay تنظیم کنید. اگر تنظیم نشود، هیچ رونوشتی استفاده نمی شود. تغییرات در این مقدار پس از یک ایندکس‌گذاری مجدد کامل اعمال می شود.
number-of-index-shards=تعداد پاره های ایندکس شرکت و سیستم
number-of-index-shards-help=تعداد پاره‌ها را برای استفاده در هنگام ایجاد یک ایندکس شرکت و سیستم Liferay تنظیم کنید. اگر تنظیم نشود، یک پاره واحد استفاده می شود. تغییرات در این مقدار پس از یک ایندکس‌گذاری مجدد کامل اعمال می شود.
operation-mode=حالت عملیات
operation-mode-help=این پیکربندی منسوخ شده است. اگر حالت تولید فعال باشد، این تنظیم نادیده گرفته می‌شود. حالت عملیات REMOTE (تولید) به یک خوشه Elasticsearch مستقل راه دور متصل می‌شود که با فعال کردن حالت تولید نیز می‌توان به آن دست یافت. حالت عملیات EMBEDDED (توسعه) یک فرآیند فرزند را شروع می‌کند که یک نمونه Elasticsearch sidecar خارجی را اجرا می‌کند. حالت عملیات EMBEDDED پشتیبانی نمی شود.
override-type-mappings=نادیده گرفتن نگاشت‌های نوع
override-type-mappings-help=نگاشت‌های سفارشی را برای جایگزینی کامل نگاشت‌های پیش‌فرض برای LiferayDocumentType، در قالب JSON (Elasticsearch Put Mapping API) تنظیم کنید. اگر این مقدار را تنظیم کنید، ایجاد ایندکس تعریف نگاشت‌های پیش‌فرض و هر نقطه توسعه را نادیده می‌گیرد و به جای آن از این تعریف نگاشت جایگزین استفاده می‌کند. اگر نیاز دارید که LiferayDocumentType با نگاشت‌های غیراستاندارد برای فیلدهای پیش‌فرض ایجاد شود، از این مورد استفاده کنید. اگر فقط نیاز دارید نگاشت‌های سفارشی جدید را بدون همپوشانی هیچ پیش‌فرضی اضافه کنید، از additionalTypeMappings استفاده کنید.
password-help=در صورت علامت زدن Authentication Enabled، رمز عبور برای احراز هویت در Elasticsearch را تنظیم کنید.
production-mode-enabled=حالت تولید فعال شد
production-mode-enabled-help=حالت تولید را فعال کنید. اگر این گزینه علامت زده شود، حالت تولید فعال می شود و پیکربندی Operation Mode نادیده گرفته می شود. حالت تولید به یک خوشه Elasticsearch مستقل راه دور متصل می شود. اگر این گزینه علامت زده نشود، پیکربندی Operation Mode استفاده می شود.
proxy-host-help=هاست پروکسی را برای استفاده برای اتصال سرویس گیرنده تنظیم کنید.
proxy-password=رمز عبور پروکسی
proxy-password-help=رمز عبور برای اتصال به پروکسی را تنظیم کنید.
proxy-port-help=درگاه پروکسی را برای استفاده برای اتصال سرویس گیرنده تنظیم کنید.
proxy-username=نام کاربری پروکسی
proxy-username-help=نام کاربری پروکسی را برای استفاده در صورت اتصال از طریق پروکسی تنظیم کنید.
remote-cluster-connection-id=شناسه اتصال خوشه راه دور
remote-cluster-connection-id-help=شناسه اتصال اتصال Elasticsearch را که باید هنگام اتصال به خوشه راه دور استفاده شود، انتخاب کنید. اتصالات Elasticsearch در تنظیمات سیستم اتصالات Elasticsearch تعریف شده اند. اگر این مقدار تنظیم نشده باشد، پیکربندی های اتصال در این صفحه به جای آن برای اتصال خوشه راه دور استفاده می شوند.
rest-client-logger-level=سطح ثبت لاگر کلاینت REST
rest-client-logger-level-help=سطح ثبت وقایع را برای کلاینت REST Elasticsearch تنظیم کنید.
sidecar-debug=اشکال زدایی Sidecar
sidecar-debug-help=این را روی درست تنظیم کنید تا حالت اشکال زدایی برای فرآیند sidecar فعال شود.
sidecar-debug-settings=تنظیمات اشکال زدایی Sidecar
sidecar-debug-settings-help=گزینه های JVM مورد استفاده برای اشکال زدایی فرآیند sidecar را تنظیم کنید.
sidecar-heartbeat-interval=فاصله تپش قلب Sidecar
sidecar-heartbeat-interval-help=فاصله تپش قلب را بر حسب میلی ثانیه تنظیم کنید که برای تشخیص سلامت فرآیند sidecar استفاده می شود.
sidecar-home=خانه Sidecar
sidecar-home-help=مسیر پوشه اصلی sidecar را که برای شروع فرآیند sidecar استفاده می شود، تنظیم کنید.
sidecar-http-port=درگاه HTTP Sidecar
sidecar-http-port-help=این پیکربندی فقط برای sidecar اعمال می شود. محدوده درگاه HTTP گره Elasticsearch sidecar را تنظیم کنید. برای یافتن خودکار یک درگاه در محدوده 9201-9300، روی AUTO تنظیم کنید. اگر تنظیم نشود، مقدار درگاه HTTP داخلی استفاده می شود.
sidecar-jvm-options=گزینه های JVM Sidecar
sidecar-jvm-options-help=گزینه های JVM مورد استفاده توسط فرآیند sidecar را تنظیم کنید.
sidecar-shutdown-timeout=مهلت زمانی خاموش شدن Sidecar
sidecar-shutdown-timeout-help=مدت زمانی را بر حسب میلی ثانیه تنظیم کنید تا قبل از اینکه فرآیند sidecar به اجبار خاموش شود، منتظر بمانید.
track-total-hits=پیگیری کل بازدیدها
track-total-hits-help=این را روی درست تنظیم کنید تا تعداد کل بازدیدها در صورت وجود بیش از 10000 نتیجه برای یک جستجو به طور دقیق شمارش شود. تنظیم این مقدار روی درست ممکن است هنگام وجود تعداد زیادی بازدید برای یک جستجو، بر عملکرد تأثیر بگذارد.
transport-tcp-port=درگاه TCP حمل و نقل
transport-tcp-port-help=این پیکربندی فقط در حالت EMBEDDED (توسعه) اعمال می‌شود. درگاهی را برای اتصال برای ارتباط بین گره‌ها مشخص کنید. یک مقدار واحد یا یک محدوده را می‌پذیرد (به عنوان مثال، 9300-9400).
truststore-password=رمز عبور Truststore
truststore-password-help=در صورت علامت زدن HTTP SSL Enabled، رمز عبور truststore را تنظیم کنید.
truststore-path=مسیر Truststore
truststore-path-help=در صورت علامت زدن HTTP SSL Enabled، مسیر فایل truststore را تنظیم کنید.
truststore-type=نوع Truststore
truststore-type-help=در صورت علامت زدن HTTP SSL Enabled، نوع truststore را تنظیم کنید.
username=نام کاربری
username-help=در صورت علامت زدن Authentication Enabled، نام کاربری برای احراز هویت در Elasticsearch را تنظیم کنید.