validate-journal-feed-references-help=در صورت فعال بودن، انتشار یا وارد کردن برخی از انواع محتوا که شامل متن هستند، باعث می‌شود Liferay ارجاعات به فیدهای محتوای وب را بررسی کرده و مطمئن شود که هر ارجاع به فید معتبری اشاره دارد.
validate-layout-references=اعتبارسنجی ارجاعات چیدمان
validate-layout-references-help=در صورت فعال بودن، انتشار یا وارد کردن برخی از انواع محتوا که شامل متن هستند، باعث می‌شود Liferay ارجاعات به میزبان‌های مجازی پورتال را بررسی کرده و مطمئن شود که هر ارجاع به صفحه معتبری در Liferay اشاره دارد. اگر میزبان مجازی شما صفحاتی خارج از Liferay دارد، این گزینه را غیرفعال کنید.
validate-missing-references=اعتبارسنجی ارجاعات گمشده
validate-missing-references-help=در صورت فعال بودن، در زمان انتشار یا وارد کردن، Liferay ارجاعات گمشده را بررسی می‌کند. در صورت غیرفعال بودن، اعتبارسنجی ارجاعات گمشده نادیده گرفته می‌شود. در نتیجه، ارجاعاتی که مقصدشان وجود ندارد نیز می‌توانند منتشر یا وارد شوند.
