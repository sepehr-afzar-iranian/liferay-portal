validate-file-entry-references-help=در صورت فعال بودن این گزینه، انتشار یا واردسازی برخی از انواع محتوا شامل متن باعث می‌شود لایفری لینک‌های اشاره‌شده به اسناد را بررسی کرده و اطمینان حاصل کند که همه آن‌ها به اسناد معتبر اشاره دارند.
