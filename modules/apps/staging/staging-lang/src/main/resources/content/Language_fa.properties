validate-layout-references-help=در صورت فعال بودن این گزینه، انتشار یا واردسازی محتواهایی که شامل متن هستند باعث می‌شود لایفری ارجاعات به میزبان‌های مجازی را بررسی کرده و اطمینان حاصل کند که همه آن‌ها به صفحات معتبر در لایفری اشاره دارند. اگر میزبان مجازی شما صفحاتی خارج از لایفری دارد، این گزینه را غیرفعال کنید.
