validate-file-entry-references-help=در صورت فعال بودن، انتشار یا وارد کردن برخی از انواع محتوا که شامل متن هستند، باعث می‌شود Liferay ارجاعات به اسناد را بررسی کرده و مطمئن شود که هر ارجاع به سند معتبری اشاره دارد.
