authorization-endpoint=نقطه پایانی مجوز
authorization-endpoint-help=نقطه پایانی مجوز را برای ارائه‌دهنده OpenID Connect تنظیم کنید.
discovery-endpoint=نقطه پایان جستجو
discovery-endpoint-cache-help=فراداده نقطه پایانی جستجو در این فاصله زمانی بر حسب میلی‌ثانیه کش می‌شود. اگر 0 تنظیم شود، فراداده هرگز تازه‌سازی نمی‌شود.
discovery-endpoint-cache-in-millis=حافظه پنهان نقطه پایانی جستجو بر حسب میلی‌ثانیه
discovery-endpoint-help=نقطه پایانی جستجو را برای ارائه‌دهنده OpenID Connect تنظیم کنید. اگر این تنظیم شده باشد، نقاط پایانی تنظیم شده به صورت دستی نادیده گرفته می‌شوند.
id-token-signing-alg-values=مقادیر الگوریتم‌های امضای توکن ID
id-token-signing-alg-values-help=الگوریتم‌های امضای توکن ID پشتیبانی شده را برای ارائه‌دهنده OpenID Connect تنظیم کنید. اگر نقطه پایانی جستجو مشخص نشده باشد، این الگوریتم‌ها استفاده می‌شوند. در این حالت، الگوریتم RS256 باید گنجانده شود و باید اولین الگوریتم در لیست باشد. اگر نقطه پایانی جستجو مشخص شده باشد، هیچ الگوریتمی نباید در اینجا مشخص شود زیرا الگوریتم‌های امضای پشتیبانی شده برای توکن هویت از نقطه پایانی جستجو به دست می‌آیند.
issuer-url=آدرس ناشر
issuer-url-help=آدرس ناشر را برای ارائه‌دهنده OpenID Connect تنظیم کنید.
jwks-uri=شناسه منبع یکنواخت JWKS
jwks-uri-help=شناسه منبع یکنواخت JWKS را برای ارائه‌دهنده OpenID Connect تنظیم کنید.
open-id-connect-client-id=شناسه مشتری OpenID Connect
open-id-connect-client-id-help=شناسه مشتری را برای ارائه‌دهنده OpenID Connect تنظیم کنید.
open-id-connect-client-secret=رمز مشتری OpenID Connect
open-id-connect-client-secret-help=رمز مشتری را برای ارائه‌دهنده OpenID Connect تنظیم کنید.
open-id-connect-provider-configuration-name=پیکربندی ارائه‌دهنده OpenID Connect
provider-name=نام ارائه دهنده
provider-name-help=نام را برای ارائه‌دهنده OpenID Connect تنظیم کنید.
scopes-help=محدوده‌هایی را که Liferay در طول احراز هویت درخواست می‌کند، تنظیم کنید. محدوده‌ها با فاصله‌ها از هم جدا می‌شوند.
subject-types=انواع موضوعات
subject-types-help=انواع موضوعات را برای ارائه‌دهنده OpenID Connect تنظیم کنید.
token-connection-timeout=زمان انتظار اتصال توکن بر حسب میلی‌ثانیه
token-connection-timeout-help=مدت زمانی را که باید صبر کرد (بر حسب میلی‌ثانیه) هنگام برقراری اتصال برای اعتبارسنجی توکن قبل از اتمام زمان، تنظیم کنید. مقدار 0 به معنی بی‌نهایت است و توصیه نمی‌شود.
token-endpoint=نقطه پایان نشانه
token-endpoint-help=نقطه پایانی نشانه را برای ارائه‌دهنده OpenID Connect تنظیم کنید.
user-info-endpoint=نقطه پایانی اطلاعات کاربر
user-info-endpoint-help=نقطه پایانی اطلاعات کاربر را برای ارائه‌دهنده OpenID Connect تنظیم کنید.