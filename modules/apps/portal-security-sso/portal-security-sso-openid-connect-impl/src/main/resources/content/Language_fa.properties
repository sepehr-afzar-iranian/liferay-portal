authorization-endpoint=نقطه پایانی مجوز
authorization-endpoint-help=نقطه پایانی مجوز را برای ارائه‌دهنده OpenID Connect تنظیم کنید.
discovery-endpoint=نقطه پایانی کشف
discovery-endpoint-cache-help=فراداده نقطه پایانی کشف در این بازه زمانی بر حسب میلی‌ثانیه ذخیره می‌شود. اگر 0 تنظیم شود، فراداده هرگز به‌روز نمی‌شود.
discovery-endpoint-cache-in-millis=حافظه پنهان نقطه پایانی کشف بر حسب میلی‌ثانیه
discovery-endpoint-help=نقطه پایانی کشف را برای ارائه‌دهنده OpenID Connect تنظیم کنید. اگر این تنظیم شود، نقاط پایانی تنظیم شده به صورت دستی نادیده گرفته می شوند.
id-token-signing-alg-values=مقادیر الگوریتم امضای توکن ID
id-token-signing-alg-values-help=الگوریتم های امضای توکن ID پشتیبانی شده را برای ارائه دهنده OpenID Connect تنظیم کنید. اگر نقطه پایانی کشف مشخص نشده باشد، از این الگوریتم ها استفاده می شود. در این حالت، الگوریتم RS256 باید گنجانده شود و باید اولین الگوریتم در لیست باشد. اگر نقطه پایانی کشف مشخص شده باشد، نباید هیچ الگوریتمی در اینجا مشخص شود، زیرا الگوریتم‌های امضای پشتیبانی شده برای توکن هویت از نقطه پایانی کشف به دست می‌آیند.
issuer-url=آدرس اینترنتی ناشر
issuer-url-help=آدرس اینترنتی ناشر را برای ارائه‌دهنده OpenID Connect تنظیم کنید.
jwks-uri=URI مربوط به JWKS
jwks-uri-help=URI مربوط به JWKS را برای ارائه‌دهنده OpenID Connect تنظیم کنید.
open-id-connect-client-id=شناسه مشتری OpenID Connect
open-id-connect-client-id-help=شناسه مشتری را برای ارائه‌دهنده OpenID Connect تنظیم کنید.
open-id-connect-client-secret=رمز مشتری OpenID connect
open-id-connect-client-secret-help=رمز مشتری را برای ارائه‌دهنده OpenID Connect تنظیم کنید.
open-id-connect-provider-configuration-name=ارائه دهنده OpenID Connect
provider-name=نام ارائه دهنده
provider-name-help=نام را برای ارائه‌دهنده OpenID Connect تنظیم کنید.
scopes-help=محدوده هایی را که Liferay در طول احراز هویت درخواست می کند تنظیم کنید. محدوده ها با فاصله از هم جدا می شوند.
subject-types=انواع موضوع
subject-types-help=انواع موضوع را برای ارائه دهنده OpenID Connect تنظیم کنید.
token-connection-timeout=مهلت زمانی اتصال توکن بر حسب میلی ثانیه
token-connection-timeout-help=مدت زمانی را که باید منتظر بمانید (بر حسب میلی‌ثانیه) هنگام ایجاد اتصال برای اعتبارسنجی توکن قبل از اتمام مهلت تنظیم کنید. مقدار 0 به معنای بی‌نهایت است و توصیه نمی‌شود.
token-endpoint=نقطه پایانی توکن
token-endpoint-help=نقطه پایانی توکن را برای ارائه‌دهنده OpenID Connect تنظیم کنید.
user-info-endpoint=نقطه پایانی اطلاعات کاربر
user-info-endpoint-help=نقطه پایانی اطلاعات کاربر را برای ارائه‌دهنده OpenID Connect تنظیم کنید.
